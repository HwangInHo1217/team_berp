<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주문 관리</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
  <!-- 공통 헤더/사이드바 -->
  <div th:replace="~{/layouts/header :: header}"></div>

  <div class="d-flex flex-grow-1">
    <div th:replace="~{/layouts/sidebar :: sidebar}"></div>

    <!-- 메인 -->
    <main class="p-4 flex-fill">
      <div class="container">
        <h2 class="mb-4">주문 관리</h2>

        <!-- ✅ 검색 & 버튼 영역 -->
        <form id="filterForm" class="row mb-3">
          <!-- 좌측: 고객사, 품목, 기간, 조회 -->
          <div class="col-md-6 d-flex align-items-center">
            <label for="companyFilter" class="me-2 mb-0">고객사:</label>
            <select id="companyFilter" name="companyId" class="form-select me-4" style="width: 180px;"></select>

            <label for="itemFilter" class="me-2 mb-0">품목:</label>
            <select id="itemFilter" name="itemId" class="form-select me-4" style="width: 180px;"></select>

            <label class="me-2 mb-0">기간:</label>
            <input type="date" id="fromDate" name="fromDate" class="form-control me-2" style="width: 150px;"/>
            <input type="date" id="toDate"   name="toDate"   class="form-control me-3" style="width: 150px;"/>

            <button type="button" id="searchBtn" class="btn btn-primary">조회</button>
          </div>

          <!-- 우측: 등록 & 삭제 -->
          <div class="col-md-6 d-flex justify-content-end">
            <button
              id="openRegisterModal"
              type="button"
              class="btn btn-success me-2"
              data-bs-toggle="modal"
              data-bs-target="#registerModal"
            >
              + 주문등록
            </button>
            <button id="deleteSelected" type="button" class="btn btn-danger">
              선택 삭제
            </button>
          </div>
        </form>

        <!-- 주문 테이블 -->
        <div class="table-responsive">
          <table class="table table-striped align-middle text-center">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAll"/></th>
                <th>순번</th>
                <th>주문일자</th>
                <th>주문번호</th>
                <th>고객사</th>
                <th>품목수</th>
                <th>총합계</th>
                <th>거래처담당자</th>
                <th>담당자</th>
                <th>상세</th>
                <th>수정</th>
              </tr>
            </thead>
            <tbody id="orderTableBody">
              <tr th:each="order, stat : ${page.content}">
                <td>
                  <input type="checkbox" class="selectBox" th:value="${order.orderId}"/>
                </td>
                <td th:text="${stat.index + 1 + page.number * page.size}"></td>
                <td th:text="${order.orderDate}"></td>
                <td th:text="${order.orderNum}"></td>
                <td th:text="${order.companyName}"></td>
                <td th:text="${order.orderQty}"></td>
                <td th:text="${order.amount}"></td>
                <td th:text="${order.companyEmpName}"></td>
                <td th:text="${order.empName}"></td>
                <td>
                  <button
                    type="button"
                    class="btn btn-info btn-sm detailBtn"
                    th:data-id="${order.orderId}"
                    data-bs-toggle="modal"
                    data-bs-target="#detailModal"
                  >
                    상세
                  </button>
                </td>
                <td>
                  <button
                    type="button"
                    class="btn btn-warning btn-sm editBtn"
                    th:data-id="${order.orderId}"
                    data-bs-toggle="modal"
                    data-bs-target="#fixedModal"
                  >
                    수정
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 페이징 -->
        <nav class="mt-4">
          <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
              <a class="page-link" th:href="@{/orders(page=${page.number-1})}">이전</a>
            </li>
            <li
              class="page-item"
              th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
              th:classappend="${i == page.number} ? 'active'"
            >
              <a class="page-link" th:href="@{/orders(page=${i})}" th:text="${i+1}"></a>
            </li>
            <li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
              <a class="page-link" th:href="@{/orders(page=${page.number+1})}">다음</a>
            </li>
          </ul>
        </nav>
      </div>
    </main>
  </div>

  <!-- 모달 포함 (별도 html include) -->
  <div th:replace="~{order/order-register-modal :: registerModal}"></div>
  <div th:replace="~{order/order-detail-modal   :: detailModal}"></div>
  <div th:replace="~{order/order-fixed-modal    :: fixedModal}"></div>

  <div th:replace="~{/layouts/footer :: footer}"></div>
  <script src="/js/order.js"></script>
</body>
</html>
