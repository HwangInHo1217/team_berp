<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>품목 관리</title>

<!-- Bootstrap 5 -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="d-flex flex-column" style="min-height: 100vh;">
	<!-- 공통 헤더 -->
	<div th:replace="~{/layouts/header :: header}"></div>

	<div class="d-flex flex-grow-1">
		<!-- 사이드바 -->
		<div th:replace="~{/layouts/sidebar :: sidebar}"></div>

		<!-- 메인 -->
		<main class="p-4 flex-fill">
			<div class="container">
				<h2 class="mb-4">품목 관리</h2>

				<!-- ✅ 검색 & 버튼 영역 -->
				<form class="row mb-3" method="get" action="/item/item">
					<!-- 탭 상태를 hidden input으로 저장 -->
					<input type="hidden" id="currentTab" name="tab" th:value="${tab}">
					<div class="col-md-6 d-flex">
						<select class="form-select me-2" id="type" name="type">
							<option value="name" th:selected="${type == 'name'}">품목명</option>
							<option value="code" th:selected="${type == 'code'}">품목코드</option>
						</select> <input type="text" class="form-control me-2" name="keyword"
							placeholder="검색어 입력" th:value="${keyword}" />
						<button type="submit" class="btn btn-outline-secondary">검색</button>
					</div>
					<div class="col-md-6 text-end">
						<button onclick="submitDelete()" class="btn btn-danger me-2">삭제</button>
						<button type="button" class="btn btn-primary"
							data-bs-toggle="modal" data-bs-target="#itemRegisterModal">+
							품목 등록</button>

					</div>


				</form>
				<form id="deleteForm" method="post" th:action="@{/item/delete}">
					<input type="hidden" name="_method" value="delete" />
					<!-- Spring이 DELETE로 인식하게 -->
					<!-- ✅ 탭 메뉴 -->
					<ul class="nav nav-tabs mb-3" id="itemTypeTabs" role="tablist">
						<li class="nav-item" role="presentation">
							<button class="nav-link active" id="all-tab" data-bs-toggle="tab"
								data-bs-target="#all" type="button" role="tab">전체</button>
						</li>
						<li class="nav-item" role="presentation">
							<button class="nav-link" id="raw-tab" data-bs-toggle="tab"
								data-bs-target="#raw" type="button" role="tab">자재 (raw)</button>
						</li>
						<li class="nav-item" role="presentation">
							<button class="nav-link" id="product-tab" data-bs-toggle="tab"
								data-bs-target="#product" type="button" role="tab">완제품
								(product)</button>
						</li>
					</ul>

				</form>
				<!-- ✅ 탭 내용 -->
				<div class="tab-content" id="itemTabContent">
					<div class="tab-pane fade show active" id="all" role="tabpanel">
						<div th:replace="~{/item/item-table :: itemTable(items=${items})}"></div>
					</div>
					<div class="tab-pane fade" id="raw" role="tabpanel">
						<div
							th:replace="~{/item/itemRawTable :: itemRawTable(items=${items})}"></div>
					</div>
					<div class="tab-pane fade" id="product" role="tabpanel">
						<div
							th:replace="~{/item/itemProductTable :: itemProductTable(items=${items})}"></div>
					</div>
				</div>

				<!-- 페이징 영역 시작 -->
				<nav th:if="${itemPage.totalPages > 0}">
					<ul class="pagination justify-content-center">

						<!-- 이전 페이지 -->
						<li class="page-item"
							th:classappend="${itemPage.first} ? 'disabled'"><a
							class="page-link"
							th:href="@{/item/item(page=${itemPage.number - 1}, size=${itemPage.size}, type=${type}, keyword=${keyword}, tab=${param.tab})}">이전</a>
						</li>

						<!-- 페이지 번호 목록 -->
						<li class="page-item"
							th:each="i : ${#numbers.sequence(0, itemPage.totalPages - 1)}"
							th:classappend="${itemPage.number == i} ? 'active'"><a
							class="page-link"
							th:href="@{/item/item(page=${i}, size=${itemPage.size}, type=${type}, keyword=${keyword}, tab=${param.tab})}"
							th:text="${i + 1}">1</a></li>

						<!-- 다음 페이지 -->
						<li class="page-item"
							th:classappend="${itemPage.last} ? 'disabled'">
							<!-- 다음 페이지 --> <a class="page-link"
							th:href="@{/item/item(page=${itemPage.number + 1}, size=${itemPage.size}, type=${type}, keyword=${keyword}, tab=${param.tab})}">다음</a>
						</li>

					</ul>
				</nav>
				<!-- 페이징 영역 끝 -->

			</div>
		</main>
	</div>
	<!-- ✅ 품목 수정 모달 추가 -->
	<div th:replace="~{/item/item-edit-modal :: itemEditModal}"></div>

	<div th:replace="~{/item/item-add-modal :: itemRegisterModal}"></div>
	<div th:replace="~{/layouts/footer :: footer}"></div>
	<script>    // 페이지 로딩 시 서버에서 받은 type에 따라 탭 상태 유지
	document.addEventListener("DOMContentLoaded", function () {
		   const type = /*[[${type}]]*/ 'all'; // Thymeleaf가 렌더링할 부분

		   if (type === 'raw') {
		     const rawTab = document.querySelector('#raw-tab');
		     rawTab?.click();
		   } else if (type === 'product') {
		     const productTab = document.querySelector('#product-tab');
		     productTab?.click();
		   } else {
		     const allTab = document.querySelector('#all-tab');
		     allTab?.click();
		   }
		 });</script>
	<script src="/js/item/item.js"></script>
</body>
</html>
