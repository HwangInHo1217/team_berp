<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>품목 관리</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
	<!-- 공통 헤더/사이드바 -->
	<div th:replace="layouts/header :: header"></div>
	<div class="d-flex flex-grow-1">
		<div th:replace="layouts/sidebar :: sidebar"></div>

		<!-- 메인 -->
		<main class="p-4 flex-fill">
			<div class="container">
				<h2 class="mb-4">품목 관리</h2>

				<!-- ✅ 검색 & 버튼 영역 -->
				<form id="searchForm" class="row mb-3">
					<div class="col-md-6 d-flex">
						<select class="form-select me-2" id="type">
							<option value="name">품목명</option>
							<option value="code">품목코드</option>
						</select> <input type="text" class="form-control me-2" id="keyword"
							placeholder="검색어 입력" />
						<button type="submit" class="btn btn-outline-secondary">검색</button>
					</div>
					<div class="col-md-6 text-end">
						<select id="searchUseYn" class="form-select w-auto d-inline me-2">
							<option value="">전체</option>
							<option value="Y">Y (사용중)</option>
							<option value="N">N (미사용)</option>
						</select>
						<button type="button" class="btn btn-danger me-2"
							onclick="submitDelete()">삭제</button>
						<button type="button" class="btn btn-primary"
							data-bs-toggle="modal" data-bs-target="#itemRegisterModal">+
							품목 등록</button>
					</div>
				</form>

				<!-- ✅ 탭 메뉴 -->
				<ul class="nav nav-tabs mb-3" id="itemTypeTabs" role="tablist">
					<li class="nav-item" role="presentation">
						<button class="nav-link active" id="all-tab" data-bs-toggle="tab"
							data-bs-target="#all" type="button" role="tab">전체</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link" id="raw-tab" data-bs-toggle="tab"
							data-bs-target="#raw" type="button" role="tab">자재 (raw)</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link" id="product-tab" data-bs-toggle="tab"
							data-bs-target="#product" type="button" role="tab">완제품
							(product)</button>
					</li>
				</ul>

				<!-- ✅ 테이블 (탭별) -->
				<div class="tab-content" id="itemTabContent">
					<div class="tab-pane fade show active" id="all" role="tabpanel">
						<div class="table-responsive">
							<table class="table table-bordered text-center align-middle">
								<thead class="table-light">
									<tr>
										<th><input type="checkbox" /></th>
										<th>품목 코드</th>
										<th>품목명</th>
										<th>구분</th>
										<th>규격</th>
										<th>단위</th>
										<th>단가</th>
										<th>안전 재고</th>
										<th>구매 리드타임</th>
										<th>사용 여부</th>
										<th>관리</th>
									</tr>
								</thead>
								<tbody></tbody>
								<!-- JS가 채움 -->
							</table>
						</div>
					</div>
					<div class="tab-pane fade" id="raw" role="tabpanel">
						<div class="table-responsive">
							<table class="table table-bordered text-center align-middle">
								<thead class="table-light">
									<tr>
										<th><input type="checkbox" /></th>
										<th>품목 코드</th>
										<th>품목명</th>
										<th>규격</th>
										<th>단위</th>
										<th>단가</th>
										<th>안전 재고</th>
										<th>구매 리드타임</th>
										<th>사용 여부</th>
										
										<th>관리</th>
									</tr>
								</thead>
								<tbody></tbody>
								<!-- JS가 채움 -->
							</table>
						</div>
					</div>
					<div class="tab-pane fade" id="product" role="tabpanel">
						<div class="table-responsive">
							<table class="table table-bordered text-center align-middle">
								<thead class="table-light">
									<tr>
										<th><input type="checkbox" /></th>
										<th>품목 코드</th>
										<th>품목명</th>
										<th>규격</th>
										<th>단위</th>
										<th>단가</th>
										<th>안전 재고</th>
										<th>구매 리드타임</th>
										<th>사용 여부</th>
										<th>관리</th>
									</tr>
								</thead>
								<tbody></tbody>
								<!-- JS가 채움 -->
							</table>
						</div>
					</div>
				</div>

				<!-- ✅ 페이징 -->
				<nav class="mt-4">
					<ul class="pagination justify-content-center"></ul>
				</nav>
			</div>
		</main>
	</div>

	<!-- ✅ 모달 영역 -->
	<div th:replace="item/item-add-modal :: itemRegisterModal"></div>
	<div th:replace="item/item-edit-modal :: itemEditModal"></div>
	<div th:replace="layouts/footer :: footer"></div>

	<script src="/js/item/item.js"></script>

</body>
</html>
