<!-- File: src/main/resources/templates/mrp/mrp-detail-modal.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <!-- th:fragment 속성만 유지하고, outer <html>, <head>, <body> 태그는 제거해야 합니다. -->
  <div th:fragment="mrp-detail-modal">
    <div class="modal fade" id="mrpDetailModal" tabindex="-1" aria-labelledby="mrpDetailModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable modal-xl">
        <div class="modal-content">
          <!-- ===== 모달 헤더 ===== -->
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="mrpDetailModalLabel">MRP 상세 정보</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="닫기"></button>
          </div>

          <!-- ===== 모달 바디 ===== -->
          <div class="modal-body p-3">
            <!-- A. 기본 정보 -->
            <section class="mb-4 p-3 bg-light rounded">
              <h6 class="text-primary border-bottom pb-1 mb-3">기본 정보</h6>
              <div class="row gx-3 gy-2">
                <div class="col-sm-6">
                  <div class="row mb-2">
                    <label class="col-sm-4 detail-label">MRP 번호</label>
                    <div class="col-sm-8 detail-value" id="mrpDetailId">-</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-sm-4 detail-label">요청 일자</label>
                    <div class="col-sm-8 detail-value" id="mrpDetailCreateDate">-</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-sm-4 detail-label">필요 일자</label>
                    <div class="col-sm-8 detail-value" id="mrpDetailDueDate">-</div>
                  </div>
                </div>
                <div class="col-sm-6">
                  <div class="row mb-2">
                    <label class="col-sm-4 detail-label">계획 타입</label>
                    <div class="col-sm-8 detail-value" id="mrpDetailPlanType">-</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-sm-4 detail-label">상태</label>
                    <div class="col-sm-8 detail-value" id="mrpDetailStatus">-</div>
                  </div>
                </div>
              </div>
            </section>

            <!-- B. 품목 정보 -->
            <section class="mb-4 p-3 bg-white rounded">
              <h6 class="text-primary border-bottom pb-1 mb-3">품목 정보</h6>
              <div class="row gx-3 gy-2">
                <div class="col-sm-4">
                  <div class="row mb-2">
                    <label class="col-5 detail-label">품목 코드</label>
                    <div class="col-7 detail-value" id="mrpDetailItemCode">-</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-5 detail-label">품목 분류</label>
                    <div class="col-7 detail-value" id="mrpDetailItemType">-</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-5 detail-label">사양 (Spec)</label>
                    <div class="col-7 detail-value" id="mrpDetailSpec">-</div>
                  </div>
                </div>
                <div class="col-sm-4">
                  <div class="row mb-2">
                    <label class="col-5 detail-label">품목명</label>
                    <div class="col-7 detail-value" id="mrpDetailItemName">-</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-5 detail-label">단위</label>
                    <div class="col-7 detail-value" id="mrpDetailUnit">-</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-5 detail-label">현재 가용 재고</label>
                    <div class="col-7 detail-value" id="mrpDetailStock">0</div>
                  </div>
                </div>
                <div class="col-sm-4">
                  <div class="row mb-2">
                    <label class="col-5 detail-label">안전 재고</label>
                    <div class="col-7 detail-value" id="mrpDetailSafetyStock">0</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-5 detail-label">재고 위치</label>
                    <div class="col-7">
                      <select id="mrpDetailLocationDropdown" class="form-select form-select-sm">
                        <option>로딩 중...</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- C. 수량·리드타임 -->
            <section class="mb-4 p-3 bg-light rounded">
              <h6 class="text-primary border-bottom pb-1 mb-3">수량·리드타임</h6>
              <div class="row gx-3 gy-2">
                <div class="col-sm-4">
                  <div class="row mb-2">
                    <label class="col-5 detail-label">요청 수량</label>
                    <div class="col-7 detail-value" id="mrpDetailRequiredQty">0</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-5 detail-label">부족 수량</label>
                    <div class="col-7 detail-value" id="mrpDetailShortQty">0</div>
                  </div>
                </div>
                <div class="col-sm-4">
                  <div class="row mb-2">
                    <label class="col-5 detail-label">구매 리드타임(일)</label>
                    <div class="col-7 detail-value" id="mrpDetailPurchaseLeadTime">0</div>
                  </div>
                  <div class="row mb-2">
                    <label class="col-5 detail-label">생산 리드타임(일)</label>
                    <div class="col-7 detail-value" id="mrpDetailProductionLeadTime">0</div>
                  </div>
                </div>
                <div class="col-sm-4">
                  <div class="row mb-2">
                    <label class="col-sm-5 detail-label">주문 가능 일자</label>
                    <div class="col-sm-7 detail-value" id="mrpDetailOrderableDate">-</div>
                  </div>
                </div>
              </div>
            </section>

            <!-- D. BOM 구성 테이블 -->
            <section class="mb-4">
              <h6 class="text-primary mb-2">BOM 구성</h6>
              <div class="table-responsive">
                <table class="table table-striped table-hover table-sm align-middle">
                  <thead class="table-light">
                    <tr>
                      <th>부품 코드</th>
                      <th>부품 명</th>
                      <th>구성 수량 per 모품</th>
                      <th>총 필요 수량</th>
                      <th>가용 재고</th>
                      <th>부족 수량</th>
                      <th>리드 타임</th>
                    </tr>
                  </thead>
                  <tbody id="mrpDetailBomBody">
                    <!-- JS에서 채워줌 -->
                  </tbody>
                </table>
              </div>
            </section>

            <!-- E. 연계 오더 현황: 생산 오더만 남김 -->
            <section class="mb-4">
              <h6 class="text-primary mb-2">연계 오더 현황</h6>
              <div class="row gx-3">
                <div class="col-md-12">
                  <strong>생산 오더 리스트</strong>
                  <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm align-middle">
                      <thead class="table-light">
                        <tr>
                          <th>WO 번호</th>
                          <th>품목</th>
                          <th>수량</th>
                          <th>시작일</th>
                          <th>종료 예정일</th>
                          <th>상태</th>
                        </tr>
                      </thead>
                      <tbody id="mrpDetailWoList"><!-- JS에서 채워짐 --></tbody>
                    </table>
                  </div>
                </div>
              </div>
            </section>

            <!-- F. 스케줄·이력 -->
            <section class="mb-4 p-3 bg-white rounded">
              <h6 class="text-primary border-bottom pb-1 mb-3">스케줄·이력</h6>
              <div id="mrpDetailLog" class="border p-2" style="max-height:200px; overflow:auto;">
                <!-- JS에서 채워짐 -->
              </div>
            </section>
          </div>

          <!-- 모달 푸터 -->
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-primary" id="modalPrevBtn" onclick="moveModal(-1)">
              이전
            </button>
            <button type="button" class="btn btn-outline-primary" id="modalNextBtn" onclick="moveModal(1)">
              다음
            </button>
            <!-- 모달에서 BOM 전체를 선택하여 다음 화면으로 넘기기 -->
            <button type="button" class="btn btn-success" id="modal-create-plan">
              생산계획 생성
            </button>
            <button type="button" class="btn btn-primary" id="modal-create-order">
              발주 생성
            </button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              닫기
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- /th:fragment="mrp-detail-modal" -->
</html>
