<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRP(자재소요계획) 관리</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
  <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}" />
  <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
  <div th:replace="~{layouts/header :: header}"></div>
  <div class="d-flex flex-grow-1">
    <div th:replace="~{layouts/sidebar :: sidebar}"></div>
    <script src="/js/layouts/sidebar.js"></script>
    <main class="p-4 flex-fill">
      <div class="container">
        <h2 class="mb-4">MRP(자재소요계획) 관리</h2>
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <input type="date" class="form-control w-auto" />
          <span>~</span>
          <input type="date" class="form-control w-auto" />
          <input type="text" class="form-control w-auto" placeholder="품목명/코드" />
          <button class="btn btn-outline-secondary">MRP 계산</button>
          <button class="btn btn-outline-success ms-auto">엑셀 다운로드</button>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
              <tr>
                <th>품목코드</th>
                <th style="cursor:pointer" onclick="sortMrp('itemName')">품목명 ▲▼</th>
                <th>품목유형</th>
                <th>단위</th>
                <th>기준일자</th>
                <th style="cursor:pointer" onclick="sortMrp('requiredQty')">필요수량 ▲▼</th>
                <th style="cursor:pointer" onclick="sortMrp('stockQty')">현재고 ▲▼</th>
                <th>확정수량</th>
                <th style="cursor:pointer" onclick="sortMrp('shortageQty')">부족수량 ▲▼</th>
                <th>소요처</th>
                <th style="cursor:pointer" onclick="sortMrp('leadTime')">리드타임(일) ▲▼</th>
                <th>비고</th>
                <th>상세</th>
              </tr>
            </thead>
            <tbody id="mrpTableBody"></tbody>
          </table>
        </div>
      </div>
      <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>
      <!-- 상세 모달 -->
      <div class="modal fade" id="mrpDetailModal" tabindex="-1" aria-labelledby="mrpDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="mrpDetailModalLabel">MRP 상세 정보</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
              <table class="table table-bordered">
                <tbody>
                  <tr><th>품목코드</th><td id="modalItemCode"></td></tr>
                  <tr><th>품목명</th><td id="modalItemName"></td></tr>
                  <tr><th>품목유형</th><td id="modalItemType"></td></tr>
                  <tr><th>단위</th><td id="modalUnit"></td></tr>
                  <tr><th>기준일자</th><td id="modalBaseDate"></td></tr>
                  <tr><th>필요수량</th><td id="modalRequiredQty"></td></tr>
                  <tr><th>현재고</th><td id="modalStockQty"></td></tr>
                  <tr><th>확정수량</th><td id="modalConfirmedQty"></td></tr>
                  <tr><th>부족수량</th><td id="modalShortageQty"></td></tr>
                  <tr><th>소요처</th><td id="modalSource"></td></tr>
                  <tr><th>리드타임</th><td id="modalLeadTime"></td></tr>
                  <tr><th>비고</th><td id="modalComment"></td></tr>
                </tbody>
              </table>
            </div>
            <div class="modal-footer">
			  <button type="button" class="btn btn-secondary" id="modalPrevBtn" onclick="moveModal(-1)">이전 자재</button>
			  <button type="button" class="btn btn-secondary" id="modalNextBtn" onclick="moveModal(1)">다음 자재</button>
			  <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">닫기</button>
			</div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div th:replace="~{layouts/footer :: footer}"></div>
  <script src="/js/mrp/mrp.js"></script>
</body>
</html>
