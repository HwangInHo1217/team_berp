<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRP(자재소요계획) 관리</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
  <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}" />
  <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
  <!-- 헤더 fragment -->
  <div th:replace="~{layouts/header :: header}"></div>
  <div class="d-flex flex-grow-1">
    <!-- 사이드바 fragment -->
    <div th:replace="~{layouts/sidebar :: sidebar}"></div>
    <main class="p-4 flex-fill">
      <div class="container">
        <!-- 검색 조건 및 버튼 -->
        <div class="mb-4">
          <h2 class="mb-3">MRP(자재소요계획) 계산</h2>
          <div class="row g-2 align-items-end">
            <div class="col-md-2">
              <label class="form-label mb-1">기간(From)</label>
              <input type="date" class="form-control" id="startDate" />
            </div>
            <div class="col-md-2">
              <label class="form-label mb-1">기간(To)</label>
              <input type="date" class="form-control" id="endDate" />
            </div>
            <div class="col-md-2">
              <label class="form-label mb-1">품목명/코드</label>
              <input type="text" class="form-control" id="itemSearch" placeholder="품목명/코드" />
            </div>
            <div class="col-md-2">
              <label class="form-label mb-1">거래처</label>
              <input type="text" class="form-control" id="custSearch" placeholder="거래처" />
            </div>
            <div class="col-md-4 d-flex gap-2">
              <button class="btn btn-primary" onclick="calculateMrp()">MRP 계산</button>
              <button class="btn btn-success" onclick="downloadExcel()">엑셀 다운로드</button>
              <button class="btn btn-outline-secondary" onclick="resetMrpForm()">취소</button>
            </div>
          </div>
        </div>

        <!-- 주문/생산 품목 리스트 -->
		<div class="table-section-title">주문/생산 품목 리스트</div>
		<div class="table-responsive mb-3">
		  <table class="table table-bordered text-center align-middle">
		    <thead class="table-light">
              <tr>
                <th class="col-no">No</th>
                <th>품목코드</th>
                <th>품목명</th>
                <th>거래처</th>
                <th>규격</th>
                <th>단위</th>
                <th>생산수량</th>
                <th>주문수량</th>
                <th>상세</th>
              </tr>
            </thead>
		    <tbody id="mrpTableBody" class="table-fixed-min"></tbody>
		  </table>
		  <nav>
		    <ul class="pagination" id="pagination"></ul>
		  </nav>
		</div>

        <!-- 하단: 투입자재 소요 리스트 (BOM 분해 결과) -->
        <!-- 투입 자재 소요 리스트 -->
		<div class="table-section-title">투입 자재 소요 리스트</div>
		<div class="table-responsive">
		  <!-- scroll-table 클래스 추가하면 BOM이 많을 때 세로 스크롤 -->
		  <div class="scroll-table">
		    <table class="table table-bordered text-center align-middle">
		      <thead class="table-light">
		      <tr>
                <th class="col-no">No</th>
                <th>자재코드</th>
                <th>자재명</th>
                <th>규격</th>
                <th>소요량</th>
                <th>단위</th>
                <th>투입예상량</th>
              </tr>
            </thead>
		    <tbody id="bomListTableBody" class="table-fixed-min"></tbody>
		   </table>
		  </div>
		</div>

        <div class="alert alert-secondary mt-3 small">
          <b>품목리스트</b> - 일자 기간 내 주문받은 품목 리스트<br>
          <b>자재리스트</b> - 품목리스트에 조회된 데이터들의 BOM 정보에 의해 계산된 투입 자재 리스트
        </div>
      </div>
    </main>
  </div>
  <!-- 모달 fragment 삽입 -->
  <div th:replace="~{mrp/mrp-detail-modal :: mrp-detail-modal}"></div>
  <!-- 푸터 fragment -->
  <div th:replace="~{layouts/footer :: footer}"></div>
  <script src="/js/mrp/mrp.js"></script>
</body>
</html>
