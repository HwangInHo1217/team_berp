<!-- 입고 관리 메인 콘텐츠 영역 receive_view.html (개선된 버전) -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- 입고 관리 메인 콘텐츠 영역 -->
<div th:fragment="receive_main">
    
    <!-- 페이지 헤더 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">입고 관리</h2>
            <p class="text-muted mb-0">원자재 및 제품 입고 내역을 관리합니다</p>
        </div>
        <div>
            <button type="button" class="btn btn-primary" onclick="openReceiveModal()">
                <i class="bi bi-plus-circle me-2"></i>
                입고 등록
            </button>
        </div>
    </div>

    <!-- 요약 통계 -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body py-3">
                    <i class="bi bi-calendar-check text-primary" style="font-size: 1.5rem;"></i>
                    <h5 class="mt-2 mb-1" th:text="${todayCount} + '건'">0건</h5>
                    <small class="text-muted">오늘 입고</small>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body py-3">
                    <i class="bi bi-boxes text-success" style="font-size: 1.5rem;"></i>
                    <h5 class="mt-2 mb-1" th:text="${#numbers.formatInteger(todayQuantity, 0, 'COMMA')} + '개'">0개</h5>
                    <small class="text-muted">오늘 입고량</small>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body py-3">
                    <i class="bi bi-graph-up text-info" style="font-size: 1.5rem;"></i>
                    <h5 class="mt-2 mb-1" th:text="${todaySummary}">로딩중...</h5>
                    <small class="text-muted">전체 요약</small>
                </div>
            </div>
        </div>
    </div>

    <!-- 검색 필터 (단일 날짜로 변경) -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">
                <i class="bi bi-funnel me-2"></i>
                검색 조건
            </h5>
        </div>
        <div class="card-body">
            <div class="row align-items-end">
                <div class="col-md-4">
                    <label for="searchDate" class="form-label">조회일자</label>
                    <input type="date" class="form-control" id="searchDate" 
                           th:value="${selectedDate}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">입고 유형</label>
                    <select class="form-select" id="searchTypeFilter">
                        <option value="">전체 유형</option>
                        <option value="ORDER_BASED">발주 기반</option>
                        <option value="INDEPENDENT">독립적 입고</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">&nbsp;</label>
                    <div>
                        <button type="button" class="btn btn-outline-secondary search-action-btn" onclick="searchReceiveHistory()">
                            <i class="bi bi-search me-1"></i>
                            검색
                        </button>
                        <button type="button" class="btn btn-outline-info search-action-btn ms-2" onclick="resetSearch()">
                            <i class="bi bi-arrow-clockwise me-1"></i>
                            전체
                        </button>
                    </div>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-md-12">
                    <small class="text-muted">
                        <i class="bi bi-info-circle me-1"></i>
                        조회일자를 선택하면 해당 날짜의 입고 내역을 조회합니다. 
                        입고 유형별로도 필터링 가능합니다.
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- 입고 이력 테이블 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="bi bi-list-ul me-2"></i>
                입고 이력
            </h5>
            <div>
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="refreshTable()">
                    <i class="bi bi-arrow-clockwise me-1"></i>
                    새로고침
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <!-- 로딩 상태 -->
            <div id="loadingState" class="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">로딩중...</span>
                </div>
                <p class="mt-2">데이터를 불러오는 중입니다...</p>
            </div>

            <!-- 빈 상태 -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="bi bi-inbox" style="font-size: 3rem; color: #dee2e6;"></i>
                <h5 class="mt-3">입고 내역이 없습니다</h5>
                <p class="text-muted">선택한 날짜에 입고된 내역이 없습니다.</p>
            </div>

            <!-- 테이블 -->
            <div id="tableContainer" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th width="8%">
                                    <input type="checkbox" class="form-check-input" id="selectAll">
                                </th>
                                <th width="8%">순번</th>
                                <th width="12%">입고일자</th>
                                <th width="12%">품목코드</th>
                                <th width="15%">품목명</th>
                                <th width="8%">수량</th>
                                <th width="6%">단위</th>
                                <th width="12%">입고처</th>
                                <th width="10%">창고</th>
                                <th width="9%">상태</th>
                            </tr>
                        </thead>
                        <tbody id="receiveTableBody">
                            <!-- 동적으로 생성될 입고 이력 데이터 -->
                        </tbody>
                    </table>
                </div>

                <!-- 페이지네이션 -->
                <nav aria-label="Page navigation" class="p-3">
                    <ul class="pagination justify-content-center mb-0" id="pagination">
                        <!-- 동적으로 생성될 페이지네이션 -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

</div>
<!-- 입고 관리 메인 콘텐츠 영역 끝 -->

</body>
</html>
