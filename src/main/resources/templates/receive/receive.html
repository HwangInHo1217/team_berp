<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입고 관리</title>

    <!-- ✅ Bootstrap 스타일 및 JS 번들 (v5.3.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        /* 기존 시스템과 통일된 스타일 */
        .table th.sortable:hover {
            background-color: #f8f9fa;
            cursor: pointer;
        }
        
        .toast-container {
            z-index: 9999;
        }

        .table tbody tr {
            cursor: pointer;
        }
        
        .table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .search-action-btn {
            min-width: 80px;
            padding: 0.375rem 1rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .search-action-btn.btn-outline-secondary:hover {
            background-color: #6c757d;
            border-color: #6c757d;
            color: white;
        }

        .search-action-btn.btn-outline-info:hover {
            background-color: #0dcaf0;
            border-color: #0dcaf0;
            color: white;
        }

        .modal-xl {
            max-width: 1200px;
        }

        .sticky-top {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .status-badge {
            font-size: 0.85em;
            padding: 0.35em 0.65em;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
    </style>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">

    <!-- ✅ Header -->
    <div th:replace="~{layouts/header :: header}"></div>
    <!-- ✅ Header 끝 -->
    
    <div class="d-flex flex-grow-1">
        <!-- ✅ Sidebar -->
        <div th:replace="~{layouts/sidebar :: sidebar}"></div>
        <!-- ✅ Sidebar 끝 -->

        <!-- ✅ Layout: Main - 입고 관리 페이지 -->
        <main class="p-4 flex-fill">
            <div class="container" th:replace="~{receive/receive_view :: receive_main}"></div>
        </main>
        <!-- ✅ Layout: Main 끝 -->
    </div>

    <!-- ✅ Footer -->
    <div th:replace="~{layouts/footer :: footer}"></div>
    <!-- ✅ Footer 끝 -->

    <!-- ✅ 입고 모달 페이지 -->
    <div th:replace="~{receive/receive_modal :: receive_modals}"></div>
    <!-- ✅ 입고 모달 페이지 끝 -->

</body>

<!-- ✅ Bootstrap JS는 body 끝에서 로드 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ 공통 레이아웃 JS -->
<!-- <script src="/js/layouts/layout.js"></script> -->

<!-- ✅ 입고 기능 전용 JS -->
<script src="/js/receive/receive-main.js"></script>
<script src="/js/receive/receive-modal.js"></script>

<!-- 공통 알림 함수 (showAlert가 없을 경우 임시) -->
<script>
    // showAlert 함수가 정의되지 않은 경우 임시 구현
    if (typeof showAlert !== 'function') {
        function showAlert(message, type = 'info') {
            console.log(`알림 (${type}): ${message}`);
            alert(message);
        }
    }
</script>

</html>
