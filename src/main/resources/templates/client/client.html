<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>거래처 관리</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
  <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}" />
  <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
  <!-- 공통 헤더 -->
  <div th:replace="~{layouts/header :: header}"></div>
  <div class="d-flex flex-grow-1">
    <!-- 공통 사이드바 -->
    <div th:replace="~{layouts/sidebar :: sidebar}"></div>
    <main class="p-4 flex-fill">
      <div class="container">
        <h2 class="mb-4">거래처 관리</h2>
        <!-- 🔹 탭 버튼 -->
        <div class="mb-3">
          <button class="btn btn-outline-primary active me-2" id="tab-client">고객사</button>
          <button class="btn btn-outline-secondary" id="tab-supplier">매입처</button>
        </div>
        <!-- 🔍 고급 검색/정렬 및 등록/삭제 버튼 -->
        <form id="searchForm" class="row align-items-center mb-3">
          <div class="col-md-9 d-flex flex-wrap align-items-center">
            <!-- 유형 -->
            <select id="filterType" class="form-select me-2 mb-1" style="width: 130px;">
              <option value="">전체유형</option>
              <option value="CUSTOMER">고객사</option>
              <option value="SUPPLIER">매입처</option>
              <option value="BOTH">겸용</option>
            </select>
            <!-- 검색 컬럼 선택 (회사명, 대표자명, 담당자명, 사업자번호) -->
            <select id="searchType" class="form-select me-2 mb-1" style="width: 130px;">
              <option value="name">거래처명</option>
              <option value="ceo">대표자명</option>
              <option value="employee">담당자명</option>
              <option value="biznum">사업자번호</option>
            </select>
            <input type="text" class="form-control me-2 mb-1" id="searchKeyword" placeholder="검색어 입력" style="width:180px;"/>
            <!-- 정렬 -->
            <select id="sortType" class="form-select me-2 mb-1" style="width: 130px;">
              <option value="">정렬기준</option>
              <option value="companyName,asc">이름↑</option>
              <option value="companyName,desc">이름↓</option>
              <option value="createdDate,desc">최신등록순</option>
              <option value="createdDate,asc">오래된순</option>
            </select>
            <button type="button" class="btn btn-outline-secondary me-2 mb-1" onclick="searchClients()">검색</button>
          </div>
          <div class="col-md-3 text-end">
            <button class="btn btn-danger me-2 mb-1" type="button" onclick="deleteChecked()">삭제</button>
            <button class="btn btn-primary mb-1" type="button" data-bs-toggle="modal" data-bs-target="#clientRegisterModal">+ 거래처 등록</button>
          </div>
        </form>
        <!-- 📋 거래처 목록 테이블 -->
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-light">
              <tr>
                <th><input type="checkbox" id="all-check" /></th>
                <th>거래처명</th>
                <th>대표자명</th>
                <th>사업자번호</th>
                <th>전화번호</th>
                <th>담당자</th>
                <th>상태</th>
                <th>상세</th>
                <th>수정</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody id="client-table">
              <!-- JS로 데이터 렌더링 -->
            </tbody>
          </table>
        </div>
        <!-- ◀️ 페이징 -->
        <nav>
          <ul class="pagination justify-content-center mt-3"></ul>
        </nav>
      </div>
      <!-- 거래처 등록/수정 모달 -->
      <div class="modal fade" id="clientRegisterModal" tabindex="-1" aria-labelledby="clientRegisterModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <form id="clientRegisterForm">
              <div class="modal-header">
                <h5 class="modal-title" id="clientRegisterModalLabel">거래처 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="editCompanyId" name="editCompanyId" />
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="companyName" class="form-label">회사명</label>
                    <input type="text" class="form-control" id="companyName" name="companyName" required />
                  </div>
                  <div class="col-md-6">
                    <label for="ceoName" class="form-label">대표자명</label>
                    <input type="text" class="form-control" id="ceoName" name="ceoName" required />
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="bizNum" class="form-label">사업자 번호</label>
                    <input type="text" class="form-control" id="bizNum" name="bizNum" />
                  </div>
                  <div class="col-md-6">
                    <label for="phone" class="form-label">전화번호</label>
                    <input type="tel" class="form-control" id="phone" name="phone" />
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="employeeId" class="form-label">담당자</label>
                    <select class="form-select" id="employeeId" name="employeeId" required>
                      <option value="">담당자 선택</option>
                    </select>
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="fax" class="form-label">팩스</label>
                    <input type="text" class="form-control" id="fax" name="fax" />
                  </div> 
                 <div class="col-md-6">
			    	<label for="postcode" class="form-label">우편번호</label>
			    	<input type="text" class="form-control" id="postcode" name="postcode" readonly placeholder="주소 검색으로 자동입력" />
				  </div>
				  <div class="col-md-6"></div>
				</div>
				<div class="row mb-3">
				  <div class="col-md-6">
				    <label for="mainAddress" class="form-label">주소</label>
				    <input type="text" class="form-control" id="mainAddress" name="mainAddress" readonly placeholder="주소 검색 클릭" style="background:#f6f6f6; cursor:pointer;" />
				  </div>
				  <div class="col-md-6">
				    <label for="detailAddress" class="form-label">상세주소</label>
				    <input type="text" class="form-control" id="detailAddress" name="detailAddress" placeholder="상세주소 입력" />
			    </div> 
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="type" class="form-label">업태</label>
                    <input type="text" class="form-control" id="type" name="type" />
                  </div>
                  <div class="col-md-6">
                    <label for="item" class="form-label">종목</label>
                    <input type="text" class="form-control" id="item" name="item" />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">거래처 유형</label>
                  <div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="clientType" id="client" value="CUSTOMER" checked />
                      <label class="form-check-label" for="client">고객사</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="clientType" id="supplier" value="SUPPLIER" />
                      <label class="form-check-label" for="supplier">매입처</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="clientType" id="both" value="BOTH" />
                      <label class="form-check-label" for="both">겸용</label>
                    </div>
                  </div>
                </div>
                <!-- 중복등록 경고 -->
                <div class="mb-3 d-none" id="duplicateWarning">
                  <div class="alert alert-danger py-2 my-2 mb-0">
                    이미 동일한 거래처(회사명/사업자번호)가 존재합니다.
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="reset" class="btn btn-secondary">초기화</button>
                <button type="submit" class="btn btn-primary" id="modalSubmitBtn">등록</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!-- 거래처 상세정보 모달: form 밖에 위치 -->
      <div class="modal fade" id="clientDetailModal" tabindex="-1" aria-labelledby="clientDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="clientDetailModalLabel">거래처 상세정보</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body" id="clientDetailBody">
              <!-- JS로 내용 채움 -->
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <!-- 공통 푸터 -->
  <div th:replace="~{layouts/footer :: footer}"></div>
  <!-- 분리된 JS 파일 불러오기 -->
  <script src="/js/client/client.js"></script>
  <!-- 다음(카카오) 우편번호 API CDN -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js">
  </script>
</body>
</html>
