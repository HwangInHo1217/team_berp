<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>거래처 관리</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
  <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}" />
  <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
  <div th:replace="~{layouts/header :: header}"></div>
  <div class="d-flex flex-grow-1">
    <div th:replace="~{layouts/sidebar :: sidebar}"></div>
    <main class="p-4 flex-fill">
      <div class="container">
        <h2 class="mb-4">거래처 관리</h2>

        <!-- 검색 / 정렬 / 등록 / 일괄삭제 -->
        <form id="searchForm" class="row align-items-center mb-3">
          <div class="col-md-9 d-flex flex-wrap align-items-center">
            <select id="filterType" class="form-select me-2 mb-1" style="width:130px;">
              <option value="">전체유형</option>
              <option value="CUSTOMER">고객사</option>
              <option value="SUPPLIER">매입처</option>
              <option value="BOTH">겸용</option>
            </select>
            <select id="searchType" class="form-select me-2 mb-1" style="width:140px;">
              <option value="name">거래처명</option>
              <option value="ceo">담당자명</option>
              <option value="employee">거래처 담당자명</option>
              <option value="biznum">사업자번호</option>
            </select>
            <input type="text" id="searchKeyword" class="form-control me-2 mb-1" placeholder="검색어 입력" style="width:180px;" />
            <select id="sortType" class="form-select me-2 mb-1" style="width:130px;">
              <option value="">정렬기준</option>
              <option value="companyName,asc">이름 ↑</option>
              <option value="companyName,desc">이름 ↓</option>
            </select>
            <button type="submit" class="btn btn-outline-secondary me-2 mb-1">검색</button>
          </div>
          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-danger me-2 mb-1" onclick="deleteChecked()">삭제</button>
            <button type="button" class="btn btn-primary mb-1" data-bs-toggle="modal" data-bs-target="#clientRegisterModal">+ 거래처 등록</button>
          </div>
        </form>

        <!-- 거래처 목록 테이블 -->
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-light">
              <tr>
                <th><input type="checkbox" id="all-check"></th>
                <th>거래처명</th>
                <th>담당자</th>
                <th>사업자번호</th>
                <th>전화번호</th>
                <th>거래처 담당자</th>
                <th>상태</th>
                <th>상세</th>
                <th>수정</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody id="client-table"></tbody>
          </table>
        </div>

        <!-- 페이징: << < [번호들] > >> + 직접 이동 입력 -->
        <div class="d-flex justify-content-center align-items-center my-2">
          <button id="firstPageBtn" class="btn btn-sm btn-outline-primary me-1">&laquo;&laquo;</button>
          <button id="prevPageBtn"  class="btn btn-sm btn-outline-primary me-3">&laquo;</button>
          <nav><ul class="pagination justify-content-center mb-0"></ul></nav>
          <button id="nextPageBtn"  class="btn btn-sm btn-outline-primary ms-3">&raquo;</button>
          <button id="lastPageBtn"  class="btn btn-sm btn-outline-primary ms-1">&raquo;&raquo;</button>
          <div class="input-group input-group-sm ms-3" style="width: 80px;">
            <input type="text" id="gotoPageInput" class="form-control" min="1" placeholder="" />
            <button id="gotoPageBtn" class="btn btn-outline-secondary">이동</button>
          </div>
        </div>
      </div>

      <!-- 거래처 등록/수정 모달 -->
      <div class="modal fade" id="clientRegisterModal" tabindex="-1" aria-labelledby="clientRegisterModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <form id="clientRegisterForm">
              <div class="modal-header">
                <h5 class="modal-title" id="clientRegisterModalLabel">거래처 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="editCompanyId" name="editCompanyId" />

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">회사명</label>
                    <input type="text" class="form-control" id="companyName" name="companyName" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">담당자명</label>
                    <input type="text" class="form-control" id="ceoName" name="ceoName" required />
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">사업자 번호</label>
                    <input type="text" class="form-control" id="bizNum" name="bizNum" maxlength="12" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">전화번호</label>
                    <input type="tel" class="form-control" id="phone" name="phone" maxlength="13" />
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-4">
                    <label class="form-label">우편번호</label>
                    <input type="text" class="form-control" id="postcode" name="postcode" readonly />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">주소</label>
                    <input type="text" class="form-control" id="companyAddr" name="companyAddr" readonly />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">상세주소</label>
                    <input type="text" class="form-control" id="detailAddress" name="detailAddress" />
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">거래처 담당자</label>
                    <select class="form-select" id="employeeId" name="employeeId" required>
                      <option value="">거래처 담당자 선택</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">팩스</label>
                    <input type="text" class="form-control" id="fax" name="fax" />
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">업태</label>
                    <input type="text" class="form-control" id="type" name="type" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">종목</label>
                    <input type="text" class="form-control" id="item" name="item" />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">거래처 유형</label>
                  <div>
                    <label class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="clientType" value="CUSTOMER" checked /> 고객사
                    </label>
                    <label class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="clientType" value="SUPPLIER" /> 매입처
                    </label>
                    <label class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="clientType" value="BOTH" /> 겸용
                    </label>
                  </div>
                </div>

                <div class="mb-3 d-none" id="duplicateWarning">
                  <div class="alert alert-danger py-2 mb-0">
                    이미 동일한 거래처(회사명/사업자번호)가 존재합니다.
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="reset" class="btn btn-secondary">초기화</button>
                <button type="submit" class="btn btn-primary" id="modalSubmitBtn">등록</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- 거래처 상세정보 -->
      <div class="modal fade" id="clientDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">거래처 상세정보</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="clientDetailBody"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
  <div th:replace="~{layouts/footer :: footer}"></div>

  <script src="/js/client/client.js"></script>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</body>
</html>
