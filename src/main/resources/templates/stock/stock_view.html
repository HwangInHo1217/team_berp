<!-- ===== stock_view.html (LOT 컬럼 제거 버전) ===== -->
<div class="container" th:fragment="stock_view">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-warehouse me-2"></i>재고 관리</h2>
        <div class="d-flex gap-2">

        </div>
    </div>

    <!-- 검색 및 필터 영역 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small text-muted">품목 검색</label>
                    <input type="text" class="form-control" id="searchInput" 
                           placeholder="품목명 또는 품목코드 입력" />
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">창고</label>
                    <select class="form-select" id="warehouseSelect">
                        <option value="">전체 창고</option>
                        <!-- 동적 로딩됨 -->
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">품목유형</label>
                    <select class="form-select" id="itemTypeFilter">
                        <option value="">전체 품목</option>
                        <option value="raw">자재</option>
                        <option value="product">완제품</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">재고상태</label>
                    <select class="form-select" id="stockStatusFilter">
                        <option value="">전체 재고</option>
                        <option value="inStock">재고 있음</option>
                        <option value="outOfStock">재고 없음</option>
                        <option value="belowSafety">안전재고 미달</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end gap-2">
                    <button class="btn btn-primary" id="searchBtn">
                        <i class="fas fa-search"></i> 검색
                    </button>
                    <button class="btn btn-outline-secondary" id="resetBtn">
                        <i class="fas fa-redo"></i> 초기화
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 재고 관리 액션 버튼 영역 -->
    <div class="row mb-3">
        <div class="col-md-6">
            <!-- 재고 전용 관리 기능들 -->
            <div class="btn-group" role="group">
                <button class="btn btn-info" id="stockTransferBtn" title="창고간 재고 이동">
                    <i class="fas fa-exchange-alt"></i> 창고이동
                </button>
                <button class="btn btn-outline-danger btn-sm" id="quickOutBtn" title="긴급 소량 출고">
                    <i class="fas fa-bolt"></i> 긴급출고
                </button>
            </div>
        </div>
        
        <div class="col-md-6 text-end">
            <!-- 다른 페이지로 이동 버튼들 -->
            <div class="btn-group me-2" role="group">
                <a href="/receive" class="btn btn-outline-success" title="정식 입고 처리">
                    <i class="fas fa-truck"></i> 입고페이지로
                </a>
                <a href="/shipment" class="btn btn-outline-primary" title="정식 출고 처리">
                    <i class="fas fa-shipping-fast"></i> 출고페이지로
                </a>
            </div>
            
            <!-- 유틸리티 -->
            <button class="btn btn-outline-success" id="excelDownloadBtn">
                <i class="fas fa-file-excel"></i> 엑셀다운로드
            </button>
        </div>
    </div>

    <!-- 재고 현황 테이블 (LOT 컬럼 제거) -->
    <div class="table-responsive">
        <table class="table table-hover" id="stockTable">
            <thead class="table-light">
                <tr>
                    <th width="4%">
                        <input type="checkbox" id="selectAll" />
                    </th>
                    <th width="4%">순번</th>
                    <th width="10%" class="sortable" data-sort="itemCode">
                        품목코드 <i class="fas fa-sort"></i>
                    </th>
                    <th width="15%" class="sortable" data-sort="itemName">
                        품목명 <i class="fas fa-sort"></i>
                    </th>
                    <th width="8%">품목유형</th>
                    <th width="12%" class="sortable" data-sort="warehouseName">
                        창고 <i class="fas fa-sort"></i>
                    </th>
                    <th width="8%" class="sortable" data-sort="quantity">
                        재고수량 <i class="fas fa-sort"></i>
                    </th>
                    <th width="5%">단위</th>
                    <!-- LOT번호 컬럼 제거 -->
                    <th width="10%">최종입고일</th>
                    <th width="10%">최종출고일</th>
                    <th width="8%">상태</th>
                    <th width="6%">액션</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <!-- JavaScript로 동적 렌더링 -->
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav aria-label="Page navigation" id="paginationNav">
        <ul class="pagination justify-content-center" id="paginationUl">
            <!-- 동적 생성 -->
        </ul>
    </nav>
    
    <!-- 페이지네이션 정보 -->
    <div id="paginationInfoDiv" class="text-center mt-2">
        <span id="paginationInfoText"></span>
    </div>
</div>

<!-- Fragment로 모달들 포함 -->
<!-- 창고 이동 모달 -->
<div th:replace="~{stock/stock_transfer :: transfer_modal}"></div>

<!-- 재고 상세 모달 -->
<div th:replace="~{stock/stock_detail_modal :: stock_modal}"></div>

<!-- 재고 이력 모달 -->
<div th:replace="~{stock/stock_log_modal :: log_modal}"></div>
