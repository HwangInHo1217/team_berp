<!-- ===== stock_view.html (재고조정 버튼 제거) ===== -->
<div class="container" th:fragment="stock_view">
    <h2 class="mb-4">재고 관리</h2>

    <!-- 검색 및 필터 영역 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="searchInput" 
                           placeholder="품목명 or 품목코드" />
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="warehouseSelect">
                        <option value="">전체 창고</option>
                        <!-- 동적 로딩됨 -->
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="itemTypeFilter">
                        <option value="">전체 품목</option>
                        <option value="raw">자재</option>
                        <option value="product">완제품</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="stockStatusFilter">
                        <option value="">전체 재고</option>
                        <option value="inStock">재고 있음</option>
                        <option value="outOfStock">재고 없음</option>
                        <option value="belowSafety">안전재고 미달</option>
                    </select>
                </div>
                <div class="col-md-3 text-end">
    				<button class="btn btn-primary" id="searchBtn">
                        <i class="fas fa-search"></i> 검색
                    </button>
                    <button class="btn btn-secondary" id="resetBtn">
                        <i class="fas fa-redo"></i> 초기화
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 액션 버튼 영역 (재고조정 버튼 제거) -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <button class="btn btn-success" id="stockInBtn">
                <i class="fas fa-plus-circle"></i> 입고
            </button>
            <button class="btn btn-danger" id="stockOutBtn">
                <i class="fas fa-minus-circle"></i> 출고
            </button>
            <!-- 재고조정 버튼 제거 -->
        </div>
        <div>
            <button class="btn btn-outline-success" id="excelDownloadBtn">
                <i class="fas fa-file-excel"></i> 엑셀 다운로드
            </button>
        </div>
    </div>

    <!-- 재고 현황 테이블 -->
    <div class="table-responsive">
        <table class="table table-hover" id="stockTable">
            <thead class="table-light">
                <tr>
                    <th width="5%">
                        <input type="checkbox" id="selectAll" />
                    </th>
                    <th width="5%">순번</th>
                    <th width="10%" class="sortable" data-sort="itemCode">
                        품목코드 <i class="fas fa-sort"></i>
                    </th>
                    <th width="15%" class="sortable" data-sort="itemName">
                        품목명 <i class="fas fa-sort"></i>
                    </th>
                    <th width="10%">품목유형</th>
                    <th width="10%" class="sortable" data-sort="warehouseName">
                        창고 <i class="fas fa-sort"></i>
                    </th>
                    <th width="10%" class="sortable" data-sort="quantity">
                        재고수량 <i class="fas fa-sort"></i>
                    </th>
                    <th width="5%">단위</th>
                    <th width="10%">최종입고일</th>
                    <th width="10%">최종출고일</th>
                    <th width="5%">상태</th>
                    <th width="5%">액션</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <!-- JavaScript로 동적 렌더링 -->
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav aria-label="Page navigation" id="paginationNav">
        <ul class="pagination justify-content-center" id="paginationUl">
            <!-- 동적 생성 -->
        </ul>
    </nav>
    
    <!-- 페이지네이션 정보 -->
    <div id="paginationInfoDiv" class="text-center mt-2">
        <span id="paginationInfoText"></span>
    </div>
</div>

<!-- 입고 모달 -->
<div class="modal fade" id="stockInModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">재고 입고</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="stockInForm">
                    <div class="mb-3">
                        <label class="form-label">품목 선택</label>
                        <select class="form-select" id="inItemId" required>
                            <option value="">품목을 선택하세요</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">창고 선택</label>
                        <select class="form-select" id="inWarehouseId" required>
                            <option value="">창고를 선택하세요</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">수량</label>
                        <input type="number" class="form-control" id="inQuantity" 
                               min="1" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">LOT 번호 (선택)</label>
                        <input type="text" class="form-control" id="inLotNumber" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">비고</label>
                        <textarea class="form-control" id="inComment" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="confirmStockIn">입고 처리</button>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{stock/stock_detail_modal :: stock_modal}"></div>

<!-- 재고 이력 모달 -->
<div class="modal fade" id="stockHistoryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">재고 이력</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="historyInfo" class="mb-3">
                    <!-- 품목/창고 정보 표시 -->
                </div>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>일시</th>
                                <th>구분</th>
                                <th>수량</th>
                                <th>비고</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- 동적 로딩 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
