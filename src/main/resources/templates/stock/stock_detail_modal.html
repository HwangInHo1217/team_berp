<!-- 재고 상세 모달 -->
<div class="modal fade" id="stockDetailModal" tabindex="-1" aria-hidden="true" th:fragment="stock_modal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">재고 상세</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <!-- 동적으로 내용이 채워짐 -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-info" onclick="StockActions.showHistoryFromDetail()">
                    <i class="fas fa-history"></i> 이력조회
                </button>
                <button type="button" class="btn btn-warning" onclick="StockActions.quickOutFromDetail()">
                    <i class="fas fa-minus-circle"></i> 출고
                </button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>
