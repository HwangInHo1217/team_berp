
<!-- ===== stock.html (메인 페이지) ===== -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재고 관리 - BERP</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Custom CSS -->
    <style>
        .table th.sortable:hover {
            background-color: #f8f9fa;
            cursor: pointer;
        }
        .toast-container {
            z-index: 9999;
        }
        .stock-checkbox {
            cursor: pointer;
        }
        .table-responsive {
            border-radius: 0.375rem;
        }
        

/* 재고 관리 테이블 정렬 CSS */
.table {
    text-align: center !important;
}

.table th, .table td {
    text-align: center !important;
    vertical-align: middle !important;
    padding: 8px 12px !important;
}

.table thead th {
    background-color: #f8f9fa !important;
    border-bottom: 2px solid #dee2e6 !important;
    font-weight: 600 !important;
}

.table tbody tr:hover {
    background-color: #f8f9fa !important;
}

.table td:last-child {
    white-space: nowrap !important;
}

.table td .btn {
    display: inline-block !important;
    margin-right: 4px !important;
}


input[type="checkbox"] {
    margin: 0 auto !important;
    display: block !important;
}

.badge {
    display: inline-block !important;
}

.btn {
    margin: 0 2px !important;
}
#searchBtn, #resetBtn {
    float: right !important;
    margin-left: 8px !important;
}

/* 개선된 페이징 스타일 */
.pagination {
    margin: 20px 0;
}

.pagination .page-link {
    color: #6c757d;
    border: 1px solid #dee2e6;
    border-radius: 4px;
    margin: 0 2px;
    padding: 8px 12px;
    transition: all 0.2s ease-in-out;
}

.pagination .page-link:hover {
    color: #0056b3;
    background-color: #e9ecef;
    border-color: #adb5bd;
}

.pagination .page-item.active .page-link {
    background-color: #007bff;
    border-color: #007bff;
    color: white;
    font-weight: bold;
}

.pagination .page-item.disabled .page-link {
    color: #6c757d;
    pointer-events: none;
    cursor: auto;
    background-color: #fff;
    border-color: #dee2e6;
}

/* 페이지 번호 간격 조정 */
.pagination .page-item:not(:first-child) .page-link {
    margin-left: -1px;
}

/* 아이콘 크기 조정 */
.pagination .page-link i {
    font-size: 12px;
}        


/* 창고이동 입고 이력 강조 */
.transfer-incoming-row {
    background-color: #f8fff8 !important;
    border-left: 4px solid #28a745;
}


/* 미사용 창고 스타일 */
.warehouse-disabled {
    color: #6c757d !important;
    text-decoration: line-through;
    opacity: 0.6;
}

.warehouse-disabled .btn {
    opacity: 0.5;
    pointer-events: none;
}

/* 이력 조회 모달 개선 */
.history-modal .table-success {
    background-color: #f8fff8 !important;
}

.history-modal .badge {
    font-size: 0.75em;
}

/* 토스트 메시지 위치 조정 */
.toast-container {
    z-index: 9999;
    position: fixed;
    bottom: 20px;
    right: 20px;
}

    </style>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">

    <!-- Header -->
    <div th:replace="~{layouts/header :: header}"></div>
    
    <div class="d-flex flex-grow-1">
        <!-- Sidebar -->
        <div th:replace="~{layouts/sidebar :: sidebar}"></div>
        
        <!-- 메인 컨텐츠 -->
        <main class="p-4 flex-fill">
            <div class="container-fluid" th:replace="~{stock/stock_view :: stock_view}"></div>
        </main>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{layouts/footer :: footer}"></div>
    
    <!-- 재고 상세 모달 -->
    <div th:replace="~{stock/stock_detail_modal :: stock_modal}"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Layout JS -->
    <script src="/js/layouts/sidebar.js"></script>
    
    <!-- 재고 관리 JS 파일들 (순서 중요!) -->

<!-- <script src="/js/stock/stock-filter.js"></script> -->
    <script src="/js/stock/stock.js"></script>              <!-- 7. 메인 초기화 (마지막) -->
</body>
</html>
