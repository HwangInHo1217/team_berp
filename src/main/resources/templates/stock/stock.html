
<!-- ===== stock.html (메인 페이지) ===== -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재고 관리 - BERP</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Custom CSS -->
    <style>
        .table th.sortable:hover {
            background-color: #f8f9fa;
            cursor: pointer;
        }
        .toast-container {
            z-index: 9999;
        }
        .stock-checkbox {
            cursor: pointer;
        }
        .table-responsive {
            border-radius: 0.375rem;
        }
        

/* 재고 관리 테이블 정렬 CSS */
.table {
    text-align: center !important;
}

.table th, .table td {
    text-align: center !important;
    vertical-align: middle !important;
    padding: 8px 12px !important;
}

.table thead th {
    background-color: #f8f9fa !important;
    border-bottom: 2px solid #dee2e6 !important;
    font-weight: 600 !important;
}

.table tbody tr:hover {
    background-color: #f8f9fa !important;
}

.table td:last-child {
    white-space: nowrap !important;
}

.table td .btn {
    display: inline-block !important;
    margin-right: 4px !important;
}


input[type="checkbox"] {
    margin: 0 auto !important;
    display: block !important;
}

.badge {
    display: inline-block !important;
}

.btn {
    margin: 0 2px !important;
}
#searchBtn, #resetBtn {
    float: right !important;
    margin-left: 8px !important;
}
        
    </style>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">

    <!-- Header -->
    <div th:replace="~{layouts/header :: header}"></div>
    
    <div class="d-flex flex-grow-1">
        <!-- Sidebar -->
        <div th:replace="~{layouts/sidebar :: sidebar}"></div>
        
        <!-- 메인 컨텐츠 -->
        <main class="p-4 flex-fill">
            <div class="container-fluid" th:replace="~{stock/stock_view :: stock_view}"></div>
        </main>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{layouts/footer :: footer}"></div>
    
    <!-- 재고 상세 모달 -->
    <div th:replace="~{stock/stock_detail_modal :: stock_modal}"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Layout JS -->
    <script src="/js/layouts/sidebar.js"></script>
    
    <!-- 재고 관리 JS 파일들 (순서 중요!) -->
<!-- 기존 모든 stock 관련 script 태그를 삭제/주석처리하고 -->

<!-- <script src="/js/stock/stock-modal.js"></script> -->
<!-- <script src="/js/stock/stock-actions.js"></script> -->
<!-- <script src="/js/stock/stock-filter.js"></script> -->
    <script src="/js/stock/stock.js"></script>              <!-- 7. 메인 초기화 (마지막) -->
</body>
</html>
