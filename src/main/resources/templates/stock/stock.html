<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재고 관리 - BERP</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/stock/stock-custom.css" />
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">

    <!-- ✅ Header -->
    <div th:replace="~{layouts/header :: header}"></div>
    
    <div class="d-flex flex-grow-1">
        <!-- ✅ Sidebar -->
        <div th:replace="~{layouts/sidebar :: sidebar}"></div>
        
        <!-- 메인 컨텐츠 -->
        <main class="p-4 flex-fill">
            <div class="container-fluid" th:replace="~{stock/stock_view :: stock_view}"></div>
        </main>
    </div>
    
    <!-- ✅ Footer -->
    <div th:replace="~{layouts/footer :: footer}"></div>
    
    <!-- ✅ 재고 상세 모달 -->
    <div th:replace="~{stock/stock_detail_modal :: stock_modal}"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Layout JS -->
    <script src="/js/layouts/layout.js"></script>
    
    <!-- Stock Management JS Files -->
    <script src="/js/stock/stock-utils.js"></script>
    <script src="/js/stock/stock-list.js"></script>
    <script src="/js/stock/stock-search.js"></script>
    <script src="/js/stock/stock-modal.js"></script>
    <script src="/js/stock/stock-actions.js"></script>
    <script src="/js/stock/stock-filter.js"></script>
    <script src="/js/stock/stock.js"></script>
</body>
</html>
