<!-- src/main/resources/templates/order/order.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주문 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
    <div th:replace="~{layouts/header :: header}"></div>
    <div class="d-flex flex-grow-1">
        <div th:replace="~{layouts/sidebar :: sidebar}"></div>
        <main class="p-4 flex-fill">
            <div class="container">
                <h2 class="mb-4">주문 관리</h2>
                <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                    <input type="text" class="form-control w-auto" placeholder="고객사명" />
                    <input type="date" class="form-control w-auto" />
                    <span class="align-self-center">~</span>
                    <input type="date" class="form-control w-auto" />
                    <button class="btn btn-outline-secondary">검색</button>
                    <button class="btn btn-outline-success ms-auto">엑셀 다운로드</button>
                    <button class="btn btn-danger">삭제</button>
                    <button class="btn btn-primary" onclick="openOrderAddModal()">+ 주문 등록</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered text-center align-middle">
                        <thead class="table-light">
                            <tr>
                                <th><input type="checkbox" /></th>
                                <th>순번</th>
                                <th>주문일자</th>
                                <th>주문번호</th>
                                <th>고객사</th>
                                <th>품목수</th>
                                <th>총금액</th>
                                <th>담당자</th>
                                <th>상세</th>
                                <th>수정</th>
                                <th>출고등록</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td><input type="checkbox" /></td>
                                <td th:text="${order.order_line_item_id}"></td>
                                <td th:text="${order.order_date}"></td>
                                <td th:text="${order.item_code}"></td>
                                <td th:text="${order.company_name}"></td>
                                <td th:text="${order.unit}"></td>
                                <td th:text="${order.unit_price}"></td>
                                <td th:text="${order.quantity}"></td>
                                <td th:text="${order.emp_name}"></td>
                                <td>
                                    <button class="btn btn-info btn-sm"
                                            th:onclick="|openOrderDetailModal({ customer: '${order.company_name}', order_date: '${order.order_date}', due_date: '${order.due_date}', manager: '${order.emp_name}', note: '${order.note}', items: ${order.items} })|">
                                        상세
                                    </button>
                                </td>
                                <td>
                                    <button class="btn btn-warning btn-sm"
                                            th:onclick="|openOrderEditModal({ order_id: ${order.order_id}, company_id: ${order.company_id}, order_date: '${order.order_date}', due_date: '${order.due_date}', emp_name: '${order.emp_name}', note: '${order.note}', items: ${order.items} })|">
                                        수정
                                    </button>
                                </td>
                                <td>
                                    <button class="btn btn-success btn-sm" onclick="openShipmentFromOrder({ company_id })">
                                        출고등록
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <!-- 
    <div th:insert="~{order/order-register-modal}"></div>
    
    <div th:insert="~{order/order-detail-modal}"></div>
    -->
    <script src="/js/order/order.js"></script>
     
</body>
</html>
