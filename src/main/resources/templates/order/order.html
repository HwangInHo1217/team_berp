<!-- File: src/main/resources/templates/order/order.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>주문 관리</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
<div class="container mt-4">
  <h1>주문 관리</h1>

  <!-- 검색 폼 -->
  <form id="searchForm" th:action="@{/order}" method="get" class="form-inline mb-3">
    <label class="mr-2">고객사:</label>
    <select name="companyId" id="companyFilter" class="form-control mr-3">
      <option value="">전체</option>
      <option th:each="c : ${customers}"
              th:value="${c.companyId}"
              th:text="${c.companyName}"
              th:selected="${c.companyId} == ${filter.companyId}"></option>
    </select>

    <label class="mr-2">품목:</label>
    <select name="itemId" id="itemFilter" class="form-control mr-3">
      <option value="">전체</option>
      <option th:each="i : ${items}"
              th:value="${i.id}"
              th:text="${i.name}"
              th:selected="${i.id} == ${filter.itemId}"></option>
    </select>

    <label class="mr-2">기간:</label>
    <input type="date" name="fromDate" th:value="${filter.fromDate}" class="form-control mr-1" />
    ~
    <input type="date" name="toDate" th:value="${filter.toDate}" class="form-control mr-3" />

    <button type="submit" class="btn btn-primary">검색</button>
    <button type="button" id="btnClearSearch" class="btn btn-secondary ml-2">초기화</button>
  </form>

  <!-- 등록·삭제 버튼 -->
  <div class="mb-2">
    <button id="btnOpenRegister" class="btn btn-success">+ 주문등록</button>
    <button id="btnDeleteSelected" class="btn btn-danger">선택삭제</button>
  </div>

  <!-- 주문 리스트 -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th><input type="checkbox" id="chkAll" /></th>
        <th>순번</th>
        <th>주문일자</th>
        <th>주문번호</th>
        <th>고객사</th>
        <th>품목수</th>
        <th>총금액</th>
        <th>담당자</th>
        <th>거래처담당자</th>
        <th>상세</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="dto, stat : ${orderPage.content}">
        <td><input type="checkbox" name="orderIds" th:value="${dto.orderId}" /></td>
        <td th:text="${stat.index + 1 + (orderPage.number * orderPage.size)}"></td>
        <td th:text="${#dates.format(dto.orderDate,'yyyy-MM-dd')}"></td>
        <td th:text="${dto.orderNum}"></td>
        <td th:text="${dto.companyName}"></td>
        <td th:text="${dto.orderLineCount}"></td>
        <td th:text="${#numbers.formatInteger(dto.amount)}"></td>
        <td th:text="${dto.empName}"></td>
        <td th:text="${dto.companyEmpName}"></td>
        <td>
          <button type="button" class="btn btn-info btn-detail" th:data-id="${dto.orderId}">상세</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- 페이지네이션 -->
  <nav>
    <ul class="pagination">
      <li class="page-item" th:classappend="${orderPage.first}? 'disabled'">
        <a class="page-link"
           th:href="@{/order(page=${orderPage.number-1},companyId=${filter.companyId},itemId=${filter.itemId},fromDate=${filter.fromDate},toDate=${filter.toDate})}">Previous</a>
      </li>
      <li class="page-item" th:each="i: ${#numbers.sequence(0, orderPage.totalPages-1)}" th:classappend="${i}==${orderPage.number}? 'active'">
        <a class="page-link"
           th:href="@{/order(page=${i},companyId=${filter.companyId},itemId=${filter.itemId},fromDate=${filter.fromDate},toDate=${filter.toDate})}"
           th:text="${i+1}">1</a>
      </li>
      <li class="page-item" th:classappend="${orderPage.last}? 'disabled'">
        <a class="page-link"
           th:href="@{/order(page=${orderPage.number+1},companyId=${filter.companyId},itemId=${filter.itemId},fromDate=${filter.fromDate},toDate=${filter.toDate})}">Next</a>
      </li>
    </ul>
  </nav>
</div>

<!-- 모달 프래그먼트 -->
<div th:insert="order/order-register-modal :: registerModal"></div>
<div th:insert="order/order-detail-modal :: detailModal"></div>
<div th:insert="order/order-fixed-modal :: fixedModal"></div>

<script th:src="@{/js/order/order.js}"></script>
</body>
</html>
