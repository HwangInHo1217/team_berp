<!-- File: src/main/resources/templates/order/order.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주문 관리</title>

  <!-- ★ Bootstrap 5 CSS (5.3.3) – 메인 템플릿에서 한 번만 선언 ★ -->
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous"
/>
</head>
<body class="d-flex flex-column" style="min-height:100vh;">

  <!-- ▶ ① 공통 헤더 -->
  <div th:replace="~{layouts/header :: header}"></div>

  <div class="d-flex flex-grow-1">
    <!-- ▶ ② 공통 사이드바 -->
    <aside th:replace="~{layouts/sidebar :: sidebar}"></aside>

    <!-- ▶ ③ 메인 콘텐츠 -->
    <main class="flex-fill p-4">
      <div class="container-fluid">
        <h2 class="mb-4">주문 관리</h2>

        <!-- ── 검색 · 액션 바 ── -->
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
          <input type="text" id="filter-company" class="form-control w-auto" placeholder="고객사명" />
          <input type="date" id="filter-date-from" class="form-control w-auto" />
          <span>~</span>
          <input type="date" id="filter-date-to" class="form-control w-auto" />
          <button class="btn btn-outline-secondary" onclick="loadOrders(0)">검색</button>

          <div class="ms-auto d-flex gap-2">
            <button class="btn btn-outline-success" onclick="downloadExcel()">엑셀 다운로드</button>
            <button class="btn btn-danger" onclick="deleteSelected()">삭제</button>
            <button class="btn btn-primary" onclick="openRegisterModal()">+ 주문 등록</button>
          </div>
        </div>

        <!-- ── 주문 테이블 ── -->
        <div class="table-responsive">
          <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-light">
              <tr>
                <th><input type="checkbox" onclick="toggleAll(this)" /></th>
                <th>순번</th>
                <th>주문일자</th>
                <th>주문번호</th>
                <th>고객사</th>
                <th>품목수</th>
                <th>총금액</th>
                <th>담당자</th>
                <th>비고</th>
                <th>상세</th>
                <th>수정</th>
                <th>출고등록</th>
              </tr>
            </thead>
            <tbody id="orderTableBody">
              <!-- order.js → loadOrders() → renderTable() 가 채워 넣음 -->
            </tbody>
          </table>
        </div>

        <!-- ── 페이징 ── -->
        <nav id="pagination" class="mt-3"></nav>
      </div>
    </main>
  </div>

  <!-- ▶ ④ 주문 등록/상세/수정 모달 fragment 로드 -->
  <div th:replace="~{order/order-register-modal :: orderRegisterModal}"></div>
  <div th:replace="~{order/order-detail-modal :: detailModal}"></div>
  <div th:replace="~{order/order-fixed :: orderEditModal}"></div>

  <!-- ▶ ⑤ 공통 푸터 -->
  <div th:replace="~{layouts/footer :: footer}"></div>

  <!-- ★ Bootstrap JS Bundle (Popper 포함) -->
  <script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous"
></script>
  <!-- ▶ 주문관리 전용 스크립트 -->
  <script th:src="@{/js/order/order.js}"></script>
</body>
</html>
