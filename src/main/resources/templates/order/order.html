<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>주문 관리 시스템</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoANmIEI2yFjL8eTztQ2QpH+XUiwmZMkH6fZt4E0i1NQnN"
    crossorigin="anonymous">
  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-4">주문 관리</h1>

    <!-- 툴바 -->
    <div class="d-flex mb-3 align-items-center">
      <button class="btn btn-primary me-3" onclick="openRegister()">+ 주문등록</button>

      <select id="filter-company" class="form-select me-2" style="width:200px;">
        <option value="">전체 고객사</option>
        <option th:each="c : ${companies}"
                th:value="${c.companyName}"
                th:text="${c.companyName}"></option>
      </select>

      <select id="filter-item" class="form-select me-2" style="width:200px;">
        <option value="">전체 품목</option>
        <option th:each="i : ${items}"
                th:value="${i.name}"
                th:text="${i.name}"></option>
      </select>

      <input type="date" id="filter-date-from" class="form-control me-2" style="width:180px;">
      <input type="date" id="filter-date-to" class="form-control me-2" style="width:180px;">

      <button class="btn btn-success" onclick="loadOrders(0)">조회</button>
    </div>

    <!-- 주문 리스트 테이블 -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th scope="col"><input type="checkbox" onclick="toggleAll(this)"></th>
            <th scope="col">순번</th>
            <th scope="col">주문일자</th>
            <th scope="col">주문번호</th>
            <th scope="col">고객사</th>
            <th scope="col">품목수</th>
            <th scope="col">총합계</th>
            <th scope="col">거래처담당자</th>
            <th scope="col">담당자</th>
            <th scope="col">상세</th>
            <th scope="col">수정</th>
          </tr>
        </thead>
        <tbody id="order-table-body">
          <!-- JS에서 렌더링 -->
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <button class="btn btn-danger" onclick="deleteSelected()">선택 삭제</button>
      <nav id="pagination"></nav>
    </div>

    <!-- 모달 삽입 영역 -->
    <div id="modal-container"></div>
  </div>

  <!-- Bootstrap JS (Modal 등) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-qQ2QpH+XUiwmZMkH6fZt4E0i1NQnN+St/S6ZWGTbNrYkJc+o7E8Q2w5co2C8YKi7"
    crossorigin="anonymous"></script>
  <!-- 주문 관련 JS -->
  <script th:src="@{/js/order/order.js}"></script>
</body>
</html>
