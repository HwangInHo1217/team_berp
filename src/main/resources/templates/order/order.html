<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 관리</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h1>주문 목록</h1>

    <!-- 검색 필터 -->
    <form id="filterForm" class="form-inline mb-3">
        <label for="companyFilter" class="mr-2">고객사:</label>
        <select id="companyFilter" class="form-control mr-4" name="companyId"></select>

        <label for="itemFilter" class="mr-2">품목:</label>
        <select id="itemFilter" class="form-control mr-4" name="itemId"></select>

        <label class="mr-2">기간:</label>
        <input type="date" id="fromDate" class="form-control mr-2" name="fromDate"/>
        <input type="date" id="toDate" class="form-control mr-4" name="toDate"/>

        <button type="button" id="searchBtn" class="btn btn-primary">조회</button>
    </form>

    <!-- 등록 및 삭제 버튼 -->
    <button id="openRegisterModal" class="btn btn-success mb-2">+ 주문등록</button>
    <button id="deleteSelected" class="btn btn-danger mb-2">선택 삭제</button>

    <!-- 주문 테이블 -->
    <table class="table table-striped">
        <thead>
        <tr>
            <th><input type="checkbox" id="selectAll"/></th>
            <th>순번</th>
            <th>주문일자</th>
            <th>주문번호</th>
            <th>고객사</th>
            <th>품목수</th>
            <th>총합계</th>
            <th>거래처담당자</th>
            <th>담당자</th>
            <th>상세</th>
            <th>수정</th>
        </tr>
        </thead>
        <tbody id="orderTableBody">
        <!-- Thymeleaf 반복으로 서버사이드 페이징 처리된 리스트 출력 -->
        <tr th:each="order, stat : ${page.content}">
            <td><input type="checkbox" class="selectBox" th:value="${order.orderId}"/></td>
            <td th:text="${stat.index + 1 + page.number * page.size}"></td>
            <td th:text="${order.orderDate}"></td>
            <td th:text="${order.orderNum}"></td>
            <td th:text="${order.company.companyName}"></td>
            <td th:text="${order.orderQty}"></td>
            <td th:text="${order.amount}"></td>
            <td th:text="${order.company.companyEmpName}"></td>
            <td th:text="${order.company.employee.empName}"></td>
            <td><button class="btn btn-info btn-sm detailBtn" th:data-id="${order.orderId}">상세</button></td>
            <td><button class="btn btn-warning btn-sm editBtn" th:data-id="${order.orderId}">수정</button></td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 -->
    <nav>
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
                <a class="page-link" th:href="@{/orders(page=${page.number-1})}">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{/orders(page=${i})}" th:text="${i+1}"></a>
            </li>
            <li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
                <a class="page-link" th:href="@{/orders(page=${page.number+1})}">다음</a>
            </li>
        </ul>
    </nav>
</div>

<!-- 모달 포함 (별도 html include) -->
<div th:replace="order-register-modal :: registerModal"></div>
<div th:replace="order-detail-modal :: detailModal"></div>
<div th:replace="order-fixed-modal :: fixedModal"></div>

<script src="/js/jquery.min.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/order.js"></script>
</body>
</html>
