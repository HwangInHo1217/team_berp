<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주문 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<script th:inline="javascript">
  /*<![CDATA[*/
  // 컨트롤러에서 model.addAttribute("orders", orders)를 해뒀다고 가정
  window.ordersList = /*[[${orders}]]*/ [];
  /*]]>*/
</script>

<body class="d-flex flex-column" style="min-height:100vh">
  <div th:replace="~{layouts/header :: header}"></div>
  <div class="d-flex flex-grow-1">
    <div th:replace="~{layouts/sidebar :: sidebar}"></div>
    <main class="flex-fill p-4">
      <div class="container">
        <h2 class="mb-4">주문 관리</h2>
        <div class="d-flex gap-2 mb-3 align-items-center">
          <input type="text" id="searchCompany" class="form-control w-auto" placeholder="고객사명" />
          <input type="date" id="fromDate" class="form-control w-auto" />
          <span>~</span>
          <input type="date" id="toDate" class="form-control w-auto" />
          <button id="searchBtn" class="btn btn-outline-secondary">검색</button>
          <button id="excelBtn" class="btn btn-outline-success ms-auto">엑셀 다운로드</button>
          <button id="deleteBtn" class="btn btn-danger">삭제</button>
          <button id="addBtn" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#orderRegisterModal" onclick="openOrderAddModal()">+ 주문 등록</button>
        </div>
        <div class="table-responsive">
          <table id="ordersTable" class="table table-bordered text-center align-middle">
            <thead class="table-light">
                <tr>
                    <th><input type="checkbox" id="selectAll" /></th>
                    <th>순번</th>
                    <th>주문일자</th>
                    <th>주문번호</th>
                    <th>고객사</th>
                    <th>품목수</th>
                    <th>총금액</th>
                    <th>BERP담당자</th>
                    <th>거래처담당자</th>
                    <th>상세</th>
                    <th>수정</th>
                    <th>출고등록</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order, stat : ${orders}">
                    <td><input type="checkbox" /></td>
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${order.orderDate}"></td>
                    <td th:text="${order.companyId}"></td>
                    <td th:text="${order.companyName}"></td>
                    <td th:text="${order.orderQty}"></td>
                    <td th:text="${order.amount}"></td>
                    <td th:text="${order.empName}"></td>
                    <td th:text="${order.companyEmpName}"></td>
                    <td>
                        <button
      type="button"
      class="btn btn-info btn-sm"
      data-bs-toggle="modal"
      th:data-bs-target="@{|#orderDetailModal__${order.orderId}|}">
      상세
    </button>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm"
                                th:onclick="|openOrderEditModal(${order.orderId})|">수정</button>
                    </td>
                    <td>
                        <button class="btn btn-success btn-sm" onclick="openShipmentFromOrder('${order.company_id}')">출고등록</button>
                    </td>
                </tr>
            </tbody>
          </table>
          <!-- 모달은 테이블 외부에 한 번만 렌더 -->
  			<div th:replace="order/order-detail-modal :: detailModal"></div>
          
          <!-- 페이징 네비가 붙을 자리 -->
			<div id="paginationContainer" class="mt-3"></div>
          
        </div>
        <div th:replace="order/order-register-modal :: registerModal(${customers}, ${items})"></div>
        <div th:replace="order/order-detail-modal :: detailModal"></div>
        <div id="shipmentModals"></div>
      </div>
    </main>
  </div>
  <div th:replace="~{layouts/footer :: footer}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/order/order.js}"></script>
</body>
</html>
