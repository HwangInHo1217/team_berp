<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주문 관리</title>
  <!-- CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous">
  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
  <!-- 공통 레이아웃 -->
  <div th:replace="~{/layouts/header :: header}"></div>
  <div class="d-flex flex-grow-1">
    <div th:replace="~{/layouts/sidebar :: sidebar}"></div>

    <main class="flex-fill p-4">
      <div class="container">
        <h2 class="mb-4">주문 관리</h2>

        <!-- 검색 필터 & 버튼 -->
        <form id="filterForm" class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <select id="searchCompanySelect" name="companyId" class="form-select w-auto">
            <option value="">전체 고객사</option>
            <option th:each="c : ${companies}"
                    th:value="${c.companyId}"
                    th:text="${c.companyName}"></option>
          </select>
          <select id="searchItemSelect" name="itemId" class="form-select w-auto">
            <option value="">전체 품목</option>
            <option th:each="i : ${items}"
                    th:value="${i.id}"
                    th:text="${i.name}"></option>
          </select>
          <input type="date" name="fromDate" class="form-control w-auto" />
          <span class="align-self-center">~</span>
          <input type="date" name="toDate" class="form-control w-auto" />
          <button type="submit" class="btn btn-outline-secondary">검색</button>
          <button type="button" id="excelDownloadBtn" class="btn btn-outline-success ms-auto" onclick="window.location.href='?export=excel'">엑셀 다운로드</button>
          <button type="button" id="deleteSelected" class="btn btn-danger">삭제</button>
        <button type="button" id="openRegisterModal" class="btn btn-primary">+ 주문등록</button>
        </form>

        <!-- 주문 테이블 -->
        <div class="table-responsive">
          <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
              <tr>
                <th><input type="checkbox" id="selectAll" /></th>
                <th>순번</th>
                <th>주문일자</th>
                <th>주문번호</th>
                <th>고객사</th>
                <th>품목수</th>
                <th>총합계</th>
                <th>거래처담당자</th>
                <th>담당자</th>
                <th>상세</th>
                <th>수정</th>
                <th>출고등록</th>
              </tr>
            </thead>
            <tbody id="orderTableBody">
              
            </tbody>
          </table>
        </div>

        <!-- 페이징 -->
        <nav class="mt-4">
          <ul class="pagination justify-content-center">
            
          </ul>
        </nav>
      </div>
    </main>
  </div>
	
  <!-- 모달 프래그먼트 삽입 -->
  <div th:insert="~{/order/order-register-modal :: registerModal}"></div>
  <div th:insert="~{/order/order-detail-modal :: detailModal}"></div>
  <div th:insert="~{/order/order-fixed-modal :: fixedModal}"></div>
  <div th:insert="~{/order/order-shipment-modal :: shipmentModal}"></div>


  <div th:replace="~{/layouts/footer :: footer}"></div>
	

	<!-- jQuery (order.js가 jQuery에 의존하므로 꼭 필요합니다) -->
  <script
  src="https://code.jquery.com/jquery-3.6.0.min.js"
  integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
  crossorigin="anonymous">
</script>

  <!-- JS Bundle -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous">
</script>
  <script src="/js/order/order.js"></script>
  <!-- <script src="/js/order/release.js"></script> -->
</body>
</html>
