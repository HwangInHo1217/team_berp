<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>주문 관리</title>
  <!-- 공통 스타일 -->
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <h1>주문 관리</h1>

  <!-- 툴바: 주문등록, 필터 -->
  <div class="toolbar">
    <button id="btn-add-order" th:onclick="|openRegisterModal()|">+ 주문등록</button>

    <!-- 고객사 필터 -->
    <select id="filter-company" th:field="*{filterCompany}">
      <option value="" th:text="'전체 고객사'" />
      <option th:each="company : ${companies}" 
              th:value="${company.companyName}"
              th:text="${company.companyName}" />
    </select>

    <!-- 품목 필터 -->
    <select id="filter-item" th:field="*{filterItem}">
      <option value="" th:text="'전체 품목'" />
      <option th:each="item : ${items}" 
              th:value="${item.itemName}"
              th:text="${item.itemName}" />
    </select>

    <!-- 날짜 범위 필터 -->
    <input type="date" id="filter-date-from" th:field="*{filterDateFrom}" />
    <input type="date" id="filter-date-to"   th:field="*{filterDateTo}" />
    <button id="btn-search" th:onclick="|searchOrders()|">조회</button>
  </div>

  <!-- 주문 테이블 -->
  <table id="order-table">
    <thead>
      <tr>
        <th><input type="checkbox" id="chk-all" onclick="toggleAll(this)" /></th>
        <th>순번</th>
        <th>주문일자</th>
        <th>주문번호</th>
        <th>고객사</th>
        <th>품목수</th>
        <th>총합계</th>
        <th>거래처담당자</th>
        <th>담당자</th>
        <th>상세</th>
        <th>수정</th>
      </tr>
    </thead>
    <tbody>
      <!-- Thymeleaf 반복: orders -->
      <tr th:each="order, stat : ${orders}">
        <!-- 개별 삭제 체크박스 -->
        <td><input type="checkbox" class="chk-one" th:value="${order.orderNum}" /></td>
        <!-- 순번: stat.count 사용 -->
        <td th:text="${stat.count}">1</td>
        <td th:text="${order.orderDate}">2025-05-28</td>
        <td th:text="${order.orderNum}">cus-001</td>
        <td th:text="${order.companyName}">ABC Corp</td>
        <td th:text="${order.orderQty}">3</td>
        <td th:text="${order.amount}">120000</td>
        <td th:text="${order.companyEmpName}">홍길동</td>
        <td th:text="${order.empName}">김철수</td>
        <!-- 상세 버튼: 모달 오픈 -->
        <td><button th:onclick="|showDetail('${order.orderNum}')|">상세</button></td>
        <!-- 수정 버튼: 모달 오픈 -->
        <td><button th:onclick="|openUpdateModal('${order.orderNum}')|">수정</button></td>
      </tr>
    </tbody>
  </table>

  <!-- 삭제 버튼 -->
  <button id="btn-delete-selected" onclick="deleteSelected()">삭제</button>

  <!-- 페이징 컨트롤: Thymeleaf 이용 -->
  <div class="pagination">
    <span th:each="pageNum : ${#numbers.sequence(1, totalPages)}">
      <a th:href="@{|/orders?page=${pageNum - 1}|}" 
         th:text="${pageNum}" 
         th:classappend="${pageNum -1 == currentPage} ? 'active' : ''">1</a>
    </span>
  </div>

  <!-- 모달 컨테이너: JS에서 템플릿 로딩 -->
  <div id="modal-container"></div>

  <!-- JS 불러오기 -->
  <script th:src="@{/js/order.js}"></script>
</body>
</html>
