<div th:fragment="fixedModal">
  <div class="modal fade" id="fixedModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="fixedForm">
          <div class="modal-header">
            <h5 class="modal-title">주문 수정</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
          </div>
          <div class="modal-body">
            <!-- registerModal과 동일한 구조, id만 fixedForm으로 바꾸고 hidden orderId 추가 -->
            <input type="hidden" name="orderId" id="fixedOrderId" />

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">고객사</label>
                <select id="fixedCompanySelect" name="companyId" class="form-select" required>
                  <option value="">-- 선택 --</option>
                  <option th:each="c : ${companies}"
                          th:value="${c.companyId}"
                          th:text="${c.companyName}"></option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">주문일자</label>
                <input type="date" id="fixedOrderDate" name="orderDate" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">담당자</label>
                <input type="text" id="fixedEmpName" class="form-control" readonly />
              </div>
              <div class="col-md-6">
                <label class="form-label">거래처담당자</label>
                <input type="text" id="fixedCompanyEmpName" class="form-control" readonly />
              </div>
              <div class="col-12">
                <label class="form-label">비고</label>
                <textarea name="note" id="fixedRemark" class="form-control"></textarea>
              </div>
            </div>

            <div class="mb-2 d-flex justify-content-between align-items-center">
              <strong>품목 정보</strong>
              <button type="button" id="addItem" class="btn btn-sm btn-outline-primary">+ 품목 추가</button>
            </div>
            <div class="table-responsive">
              <table class="table table-bordered text-center align-middle" id="fixedItemsTable">
                <thead class="table-light">
                  <tr>
                    <th>품목</th>
                    <th>단위</th>
                    <th>단가</th>
                    <th>수량</th>
                    <th>합계</th>
                    <th>삭제</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <input type="hidden" name="orderType" value="CUSTOMER" />
            <input type="hidden" name="itemType" value="product" />
          </div>
          <div class="modal-footer">
            <span class="me-auto fw-bold">총합계: <span id="totalAmount">0.00</span></span>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            <button type="button" id="updateOrder" class="btn btn-primary">수정</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
