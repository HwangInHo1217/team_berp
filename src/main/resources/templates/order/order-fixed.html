<!-- File: src/main/resources/templates/order/order-fixed.html -->
<div th:fragment="orderEditModal">
  <div class="modal fade" id="orderEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">

        <!-- 헤더 -->
        <div class="modal-header">
          <h5 class="modal-title">주문 수정</h5>
          <button type="button" class="btn-close" aria-label="닫기" onclick="closeModal()"></button>
        </div>

        <!-- 바디: 수정 폼 -->
        <div class="modal-body">
          <form id="formEdit" class="row g-3">
            <input type="hidden" id="edit-order-num" />

            <div class="col-md-4">
              <label for="upd-customer" class="form-label">고객사</label>
              <select id="upd-customer" name="customerId" class="form-select" required onchange="onCompanyChange(this)">
                <option value="">-- 선택 --</option>
                <option th:each="c : ${companies}"
                        th:value="${c.companyId}"
                        th:text="${c.companyName}"></option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="upd-order-date" class="form-label">주문일자</label>
              <input id="upd-order-date" type="date" name="orderDate" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label for="upd-manager" class="form-label">담당자</label>
              <input id="upd-manager" type="text" name="manager" class="form-control" required />
            </div>
            <div class="col-md-8">
              <label for="upd-note" class="form-label">비고</label>
              <input id="upd-note" type="text" name="note" class="form-control" />
            </div>

            <!-- 품목 테이블 -->
            <div class="col-12">
              <div class="table-responsive">
                <table class="table table-bordered text-center align-middle">
                  <thead class="table-light">
                    <tr>
                      <th>품목</th><th>수량</th><th>단위</th><th>단가</th><th>합계</th><th>삭제</th>
                    </tr>
                  </thead>
                  <tbody id="edit-items-body">
                    <!-- JS populateUpdateModal()가 채움 -->
                  </tbody>
                </table>
              </div>
              <button type="button" class="btn btn-outline-primary" onclick="addOrderItemRow()">+ 품목 추가</button>
            </div>
          </form>
        </div>

        <!-- 푸터 -->
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">취소</button>
          <button class="btn btn-primary" onclick="updateOrder()">수정</button>
        </div>

      </div>
    </div>
  </div>
</div>
