<!-- src/main/resources/templates/order/order-detail-modal.html -->
<div th:fragment="orderDetailModal(order)">
  <!-- 주문별 고유 ID를 포함해 모달 ID 지정 -->
  <div class="modal fade" th:id="'orderDetailModal__' + ${order.order_id}" tabindex="-1" aria-labelledby="orderDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content" th:object="${order}">
        <div class="modal-header">
          <h5 class="modal-title" id="orderDetailModalLabel">주문 상세 - <span th:text="*{order_id}"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- 주문 기본 정보 -->
          <table class="table table-bordered mb-4">
            <tbody>
              <tr><th>주문번호</th>   <td th:text="*{order_id}"></td></tr>
              <tr><th>주문유형</th>   <td th:text="*{order_type}"></td></tr>
              <tr><th>주문일자</th>   <td th:text="*{order_date}"></td></tr>
              <tr><th>고객사</th>     <td th:text="*{company_name}"></td></tr>
              <tr><th>담당자</th>     <td th:text="*{emp_name}"></td></tr>
            </tbody>
          </table>
          <!-- 주문 품목 상세 -->
          <h5 class="mb-3">품목 정보</h5>
          <table class="table table-bordered">
            <thead class="table-light">
              <tr>
                <th>품목 ID</th>
                <th>품목명</th>
                <th>수량</th>
              </tr>
            </thead>
            <tbody th:each="item : *{items}">
              <tr>
                <td th:text="${item.item_id}"></td>
                <td th:text="${item.item_name}"></td>
                <td th:text="${item.order_qty}"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>
