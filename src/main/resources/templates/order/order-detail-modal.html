<div th:fragment="detailModal">
  <div class="modal fade" id="orderDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderDetailModalLabel">주문 상세 조회</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3 mb-4">
            <div class="col-md-4"><label class="fw-bold">고객사</label><div id="detailCustomer"></div></div>
            <div class="col-md-4"><label class="fw-bold">주문일</label><div id="detailOrderDate"></div></div>
            <div class="col-md-4"><label class="fw-bold">납기일</label><div id="detailDueDate"></div></div>
            <div class="col-md-4"><label class="fw-bold">담당자</label><div id="detailManager"></div></div>
            <div class="col-md-8"><label class="fw-bold">비고</label><div id="detailNote"></div></div>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered text-center">
              <thead class="table-light">
                <tr><th>품목코드</th><th>품목명</th><th>수량</th><th>단위</th><th>단가</th><th>금액</th></tr>
              </thead>
              <tbody id="orderDetailItems"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>
