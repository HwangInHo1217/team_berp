<!-- 주문 상세 모달 -->
<div th:fragment="detailModal" id="order-detail-modal" class="modal">
  <h2>주문 상세</h2>
  <dl>
    <dt>주문번호</dt><dd id="det-num"></dd>
    <dt>주문일자</dt><dd id="det-date"></dd>
    <dt>고객사</dt><dd id="det-company"></dd>
    <dt>거래처담당자</dt><dd id="det-comp-emp"></dd>
    <dt>담당자</dt><dd id="det-emp"></dd>
    <dt>비고</dt><dd id="det-remark"></dd>
  </dl>
  <table>
    <thead>
      <tr>
        <th>품목</th><th>단위</th><th>단가</th><th>수량</th><th>합계</th>
      </tr>
    </thead>
    <tbody id="det-items"></tbody>
  </table>
  <button type="button" class="btn-close" onclick="closeModal()">닫기</button>
</div>
