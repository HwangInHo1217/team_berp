<!-- order-register-modal.html (통합 리팩토링 버전) -->
<!-- order-register-modal.html -->
<div th:fragment="registerModal">
  <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="registerForm">
          <div class="modal-header">
            <h5 class="modal-title">주문 등록</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
          </div>
          <div class="modal-body">
            <!-- 기본정보 -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="companySelect" class="form-label">고객사</label>
                <select id="companySelect" name="companyId" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">주문일자</label>
                <input type="date" name="orderDate" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label for="empName" class="form-label">담당자</label>
                <input type="text" id="empName" name="empName" class="form-control" readonly />
              </div>
              <div class="col-md-6">
                <label for="companyEmpName" class="form-label">거래처 담당자</label>
                <input type="text" id="companyEmpName" name="companyEmpName" class="form-control" required />
              </div>
              <div class="col-12">
                <label class="form-label">비고</label>
                <textarea name="remark" class="form-control"></textarea>
              </div>
            </div>

            <!-- 품목 리스트 -->
            <div class="mb-2 d-flex justify-content-between align-items-center">
              <strong>품목 정보</strong>
              <button type="button" id="addItem" class="btn btn-sm btn-outline-primary">+ 품목 추가</button>
            </div>
            <div class="table-responsive">
              <table class="table table-bordered text-center align-middle" id="itemsTable">
                <thead class="table-light">
                  <tr>
                    <th style="width: 120px;">품목</th>
                    <th style="width: 90px;">단위</th>
                    <th style="width: 100px;">단가</th>
                    <th style="width: 70px;">수량</th>
                    <th style="width: 100px;">합계</th>
                    <th style="width: 70px;">삭제</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <!-- Hidden -->
            <input type="hidden" name="orderType" value="CUSTOMER" />
            <input type="hidden" name="itemType" value="product" />
          </div>
          <div class="modal-footer">
            <span class="me-auto fw-bold">총합계: <span id="totalAmount">0.00</span> 원</span>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            <button type="button" id="saveOrder" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
