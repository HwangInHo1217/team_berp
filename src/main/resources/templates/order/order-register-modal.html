<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="registerModal">
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">주문 등록</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <!-- 고객사 선택 -->
                        <div class="form-group">
                            <label>고객사</label>
                            <select id="companySelect" name="companyId" class="form-control" required></select>
                        </div>
                        <!-- 담당자, 거래처담당자 자동 채움 -->
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>담당자</label>
                                <input type="text" id="empName" class="form-control" readonly />
                            </div>
                            <div class="form-group col-md-6">
                                <label>거래처담당자</label>
                                <input type="text" id="companyEmpName" class="form-control" readonly />
                            </div>
                        </div>
                        <!-- 주문일자 -->
                        <div class="form-group">
                            <label>주문일자</label>
                            <input type="date" name="orderDate" class="form-control" required />
                        </div>
                        <!-- 비고 -->
                        <div class="form-group">
                            <label>비고</label>
                            <textarea name="remark" class="form-control"></textarea>
                        </div>

                        <!-- 품목 라인 아이템 테이블 -->
                        <h5>품목 정보</h5>
                        <table class="table" id="itemsTable">
                            <thead>
                            <tr>
                                <th>품목</th>
                                <th>단위</th>
                                <th>단가</th>
                                <th>수량</th>
                                <th>합계</th>
                                <th>액션</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- 첫 번째 행 초기화 -->
                            <tr>
                                <td>
                                    <select class="form-control itemSelect" required></select>
                                </td>
                                <td><input type="text" class="form-control unit" readonly /></td>
                                <td><input type="number" class="form-control unitPrice" min="0" required /></td>
                                <td><input type="number" class="form-control unitQty" min="1" required /></td>
                                <td><input type="number" class="form-control unitTotal" readonly /></td>
                                <td><button type="button" class="btn btn-danger btn-sm removeItem">삭제</button></td>
                            </tr>
                            </tbody>
                        </table>
                        <button type="button" id="addItem" class="btn btn-link">+ 품목 추가</button>

                        <!-- Hidden 필드: orderType, itemType -->
                        <input type="hidden" name="orderType" value="CUSTOMER" />
                        <input type="hidden" name="itemType" value="product" />
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveOrder" class="btn btn-primary">저장</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
