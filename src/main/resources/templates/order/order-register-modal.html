<!-- src/main/resources/templates/order/order-register-modal.html -->
<div class="modal fade" id="orderRegisterModal" tabindex="-1" aria-labelledby="orderRegisterModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="orderRegisterModalLabel">주문 등록</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="orderForm" method="post" th:action="@{/orders}" th:object="${orderFormDto}">
          <div class="mb-3">
            <label class="form-label">고객사</label>
            <input type="text" class="form-control" th:field="*{company_id}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">주문일자</label>
            <input type="date" class="form-control" th:field="*{order_date}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">납기일자</label>
            <input type="date" class="form-control" th:field="*{due_date}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">담당자</label>
            <input type="text" class="form-control" th:field="*{employee_id}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">비고</label>
            <input type="text" class="form-control" th:field="*{note}" />
          </div>

          <button id="addItemBtn" type="button" class="btn btn-sm btn-outline-primary mb-2">품목 추가</button>

          <table id="orderItemTable" class="table">
            <thead>
              <tr>
                <th>품목</th>
                <th>수량</th>
                <th>단위</th>
                <th>단가</th>
                <th>합계</th>
                <th>액션</th>
              </tr>
            </thead>
            <tbody th:each="item, idx : *{items}">
              <tr>
                <td>
                  <select class="form-select" th:field="*{items[__${idx}__].item_id}" required>
                    <option value="">-- 선택 --</option>
                    <option value="P001">P001 - 완제품 A</option>
                    <option value="P002">P002 - 완제품 B</option>
                  </select>
                </td>
                <td><input type="number" class="form-control" th:field="*{items[__${idx}__].order_qty}" oninput="calculateRowTotal(this)" required /></td>
                <td><input type="text" class="form-control" th:field="*{items[__${idx}__].unit}" value="EA" required /></td>
                <td><input type="number" class="form-control" th:field="*{items[__${idx}__].unit_price}" oninput="calculateRowTotal(this)" required /></td>
                <td><input type="text" class="form-control total" readonly value="0" /></td>
                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeOrderItemRow(this)">삭제</button></td>
              </tr>
            </tbody>
          </table>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            <button type="submit" class="btn btn-primary">등록</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
