<!-- File: src/main/resources/templates/order/order-register-modal.html -->
<div th:fragment="registerModal">
  <div class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">주문 등록</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="registerForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">고객사</label>
                <select id="selCompany" name="companyId" class="form-select" required>
                  <option value="" disabled selected>-- 선택 --</option>
                  <option th:each="c : ${customers}" th:value="${c.companyId}" th:text="${c.companyName}" th:data-emp="${c.employee.empName}" th:data-compEmp="${c.companyEmpName}"></option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">담당자</label>
                <input type="text" id="inpEmpName" name="empName" class="form-control" readonly />
              </div>
              <div class="col-md-4">
                <label class="form-label">거래처담당자</label>
                <input type="text" id="inpCompanyEmpName" name="companyEmpName" class="form-control" readonly />
              </div>
              <div class="col-md-4">
                <label class="form-label">주문일자</label>
                <input type="date" name="orderDate" class="form-control" required />
              </div>
              <div class="col-md-8">
                <label class="form-label">비고</label>
                <textarea name="note" class="form-control" rows="2"></textarea>
              </div>
            </div>

            <hr />
            <h5>품목 리스트</h5>
            <button type="button" class="btn btn-sm btn-outline-primary mb-2" id="btnAddItem">+ 품목추가</button>
            <div class="table-responsive">
              <table class="table table-bordered" id="tblItems">
                <thead>
                  <tr>
                    <th>품목</th>
                    <th>수량</th>
                    <th>단위</th>
                    <th>단가</th>
                    <th>금액</th>
                    <th>액션</th>
                  </tr>
                </thead>
                <tbody></tbody>
                <tfoot>
                  <tr>
                    <td colspan="4" class="text-end">총 합계:</td>
                    <td><span id="lblTotalAmount">0</span></td>
                    <td></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnResetRegister">초기화</button>
          <button type="button" class="btn btn-primary" id="btnSaveOrder">등록</button>
        </div>
      </div>
    </div>
  </div>
</div>
