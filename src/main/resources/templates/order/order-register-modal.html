<!-- 주문 등록 모달 -->
<div th:fragment="registerModal" id="order-register-modal" class="modal">
  <form id="form-register-order" onsubmit="registerOrder(event)">
    <h2>주문 등록</h2>

    <!-- 고객사 선택: 변경 시 담당자, 거래처담당자 자동 채움 -->
    <label>고객사
      <select name="companyName" id="reg-company" onchange="onCompanyChange(this)">
        <option value="" th:text="'선택하세요'" />
        <option th:each="company : ${companies}"
                th:value="${company.companyName}"
                th:text="${company.companyName}" />
      </select>
    </label>

    <!-- 자동 읽기 전용 필드들 -->
    <label>담당자<input type="text" name="empName" id="reg-emp" readonly /></label>
    <label>거래처담당자<input type="text" name="companyEmpName" id="reg-comp-emp" readonly /></label>

    <!-- 주문일자: 필수 -->
    <label>주문일자<input type="date" name="orderDate" id="reg-date" required /></label>

    <!-- 비고: 선택 -->
    <label>비고<textarea name="remark" id="reg-remark"></textarea></label>

    <!-- 품목 정보 테이블 -->
    <div id="reg-items">
      <table>
        <thead>
          <tr>
            <th>품목</th>
            <th>단위</th>
            <th>단가</th>
            <th>수량</th>
            <th>합계</th>
            <th><button type="button" onclick="addItemRow('reg-items-body')">추가</button></th>
          </tr>
        </thead>
        <tbody id="reg-items-body"></tbody>
      </table>
    </div>

    <button type="submit">등록</button>
    <button type="button" class="btn-close" onclick="closeModal()">닫기</button>
  </form>
</div>
