<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발주 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
  .custom-modal-dialog {
    max-width: 1300px; /* 너비를 넓히고 싶은 만큼 조절 (예: 900px, 80vw 등) */
    margin: auto;     /* 가운데 정렬 */
  }
</style>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">

<!-- 공통 헤더 -->
  <div th:replace="~{/layouts/header :: header}"></div>
  <div class="d-flex flex-grow-1">
       <!-- 공통 사이드바 -->
    <div th:replace="~{/layouts/sidebar :: sidebar}"></div>

    <!-- ✅ 본문 영역 -->
    <div class="container py-4">
      <h2 class="mb-4">발주 관리</h2>

      <!-- 🔍 검색 + 버튼 -->
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <input type="text" class="form-control w-auto" placeholder="품목명" />
        <input type="date" class="form-control w-auto" />
        <span class="align-self-center">~</span>
        <input type="date" class="form-control w-auto" />
        <button class="btn btn-outline-secondary">검색</button>
        <button class="btn btn-outline-success ms-auto">엑셀 다운로드</button>
        <button class="btn btn-danger">삭제</button>
        <button class="btn btn-primary" onclick="openplaceAddModal()" data-bs-toggle="modal" data-bs-target="#placeRegisterModal">
          + 발주 등록
        </button>
      </div>

      <!-- 📋 발주 테이블 -->
      <div class="table-responsive">
        <table class="table table-bordered text-center align-middle">
          <thead class="table-light">
            <tr>
              <th><input type="checkbox" /></th>
              <th>순번</th>
              <th>발주일자</th>
              <th>거래처</th>
              <th>품목코드</th>
              <th>품목명</th>
              <th>수량</th>
              <th>단위</th>
              <th>담당자</th>
              <th>상세</th>
              <th>수정</th>
              <th>입고등록</th>
            </tr>
          </thead>
          
         <tbody>
			<tr th:each="order, stat : ${orderList}">
			  <td><input type="checkbox" th:value="${order.orderId}" /></td>
			  <td th:text="${stat.count}">1</td> <!-- 순번 -->
			  <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}">2024-01-01</td> <!-- 발주일자 -->
			  <td th:text="${order.company.companyName}">거래처명</td>
			
			  <!-- 가장 첫 번째 품목 기준 출력 -->
			  <td th:text="${order.lineItems[0].item.code}">품목코드</td>
			  <td th:text="${order.lineItems[0].item.name}">품목명</td>
			  <td th:text="${order.lineItems[0].unitQty}">수량</td>
			  <td th:text="${order.lineItems[0].item.unit}">단위</td>
			
			  <td th:text="${order.company.employee.empName}">담당자</td> <!-- employee 엔티티 연결된 경우 -->
			
			  <td>
			    <button class="btn btn-info btn-sm"
			            th:onclick="'openplaceDetailModal(' + ${order.orderId} + ')'"
			            data-bs-toggle="modal"
			            data-bs-target="#placeDetailModal">상세</button>
			  </td>
			  <td>
			    <button class="btn btn-warning btn-sm"
			            th:onclick="'openplaceEditModal(' + ${order.orderId} + ')'"
			            data-bs-toggle="modal"
			            data-bs-target="#placeEditModal">수정</button>
			  </td>
			  <td>
			    <button type="submit" class="btn btn-warning btn-sm"
			            th:onclick="'registerInbound(' + ${order.orderId} + ')'">입고 등록</button>
			  </td>
			</tr>
			</tbody>

        </table>
      </div>
    </div>
  </div>
   <!-- 공통 푸터 -->
  <div th:replace="~{/layouts/footer :: footer}"></div>

  <!-- ✅ 모달 삽입용 div -->
 <div th:replace="~{place/place-detail-modal :: place-detail-modal}"></div>
 <div th:replace="~{place/place-register-modal :: place-register-modal}"></div>
</body>
<script src="/js/place/place.js"></script>
</html>
