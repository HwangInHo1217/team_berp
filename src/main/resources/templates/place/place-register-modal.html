<!-- 발주 등록/수정 모달 -->
<div class="modal fade" id="placeRegisterModal" tabindex="-1" aria-hidden="true" th:fragment="place-register-modal">
  <div class="modal-dialog custom-modal-dialog">
    <div class="modal-content">
      <form id="placeForm" method="post" action="/place/add">
        <div class="modal-header">
          <h5 class="modal-title">발주 등록</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>
         <div class="modal-body">
          <!-- 1. 발주 기본 정보 -->
          <div class="row mb-3">
            <div class="col-md-4">
              <label for="orderDate" class="form-label">발주일자</label>
              <input type="date" class="form-control" name="orderDate" required>
            </div>
           <div class="col-md-4">
           <!-- 사업장 유형 선택 -->
           <label for="orderType" class="form-label">사업장 유형</label>
           <select id="orderType" name="orderType" class="form-control" onchange="filterCompanies()" required>
             <option value="">-- 유형 선택 --</option>
             <option value="SUPPLIER">거래처</option>
             <option value="CUSTOMER">고객사</option>
           </select>
         </div>
         
         <div class="col-md-4">
           <!-- 사업장명 선택 -->
           <label for="companySelect" class="form-label">사업장명</label>
           <select id="companySelect" name="companyId" class="form-control" required>
             <option value="">-- 사업장 선택 --</option>
             <option th:each="c : ${companies}"
                     th:value="${c.companyId}"
                     th:data-type="${c.companyType}"
                     th:text="${c.companyName}">
             </option>
           </select>
         </div>
          </div>

            <div class="row mb-3">
			  <!-- 2. 담당자 명 -->
			  <div class="col-md-4">
			    <label for="empName" class="form-label">담당자 명</label>
			    <input type="text" id="empName" name="empName" class="form-control" readonly>
			  </div>
			
			  <!-- 3. 이메일 -->
			  <div class="col-md-4">
			    <label for="empEmail" class="form-label">이메일</label>
			    <input type="email" id="empEmail" name="empEmail" class="form-control" readonly>
			  </div>
			
			  <!-- 4. 전화번호 -->
			  <div class="col-md-4 ">
			    <label for="empHp" class="form-label">전화번호</label>
			    <input type="text" id="empHp" name="empHp" class="form-control" readonly>
			  </div>
			</div>
			
          <!-- 3. 품목 목록 -->
			<div>
			  <table class="table table-bordered" id="itemTable">
			    <thead>
			      <tr>
			        <th style="width: 10%">품목타입</th>
			        <th style="width: 20%">품목명</th>
			        <th style="width: 15%">품목코드</th>
			        <th style="width: 10%">수량</th>
			        <th style="width: 10%">단위</th>
			        <th style="width: 10%">단가</th>
			        <th style="width: 15%">품목 총계</th>
			        <th style="width: 10%">삭제</th>
			      </tr>
			    </thead>
    <tbody id="itemListContainer">
      <!-- 초기 품목 행, 품목 유형 선택 -->
      <tr class="item-row">
        <td>
          <select class="form-select item-type" name="itemType" onchange="loadItems(this)" required>
              <option value="">-- 자재 선택 --</option>
              <option value="자재">자재</option>
              <option value="완제품">완제품</option>
          </select>
        </td>
        
        <!-- 품목명 선택 (초기에는 비어 있음) -->
	    <td>
	      <select class="form-select item-name" onchange="fillItemDetails(this)" required>
	        <option value="">-- 품목 선택 --</option>
	      </select>
	    </td>
       <td><input type="text" class="form-control item-code" readonly></td>
        <td><input type="number" class="form-control unit-qty" min="1" value="1" required></td>
        <td><input type="text" class="form-control item-unit" readonly></td>
        <td><input type="text" class="form-control unit-price" readonly></td>
        <td><input type="text" class="form-control unit-price-all" readonly></td>
        <td><button type="button" onclick="removeItemRow(this)" class="btn btn-danger btn-sm">삭제</button></td>
	  </tr>
	    </tbody>
	  </table>
	  <button type="button" class="btn btn-secondary btn-sm" onclick="addItemRow()">품목 추가</button>
	</div>

          <!-- 4. 합계 -->
          <div class="mt-3 text-end">
            <strong>총 수량:</strong> <span id="orderQty">0</span>
            &nbsp;&nbsp;
            <strong>총 금액:</strong> <span id="amount">0</span> 원
          </div>

          <!-- 5. 비고 -->
          <div class="row mt-4">
            <div class="col-12">
              <label class="form-label">비고</label>
              <textarea class="form-control" name="note" id="note" rows="3" placeholder="추가 사항이나 특이사항을 입력하세요"></textarea>
            </div>
          </div>
        </div>
          
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="placeReset()">초기화</button>
          <button type="button" class="btn btn-primary" onclick="placeSubmit()">등록</button>
        </div>
      </form>
    </div>
  </div>
</div>
