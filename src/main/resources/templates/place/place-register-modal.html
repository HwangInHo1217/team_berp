<!-- 발주 등록/수정 모달 -->
<div class="modal fade" id="placeRegisterModal" tabindex="-1" aria-hidden="true" th:fragment="place-register-modal">
  <div class="modal-dialog custom-modal-dialog">
    <div class="modal-content">
      <form id="placeForm" method="post" action="/place/add">
        <div class="modal-header">
          <h5 class="modal-title">발주 등록</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">발주일자</label>
            <input type="date" class="form-control" name="orderDate" id="orderDate" required />
             <!-- 
            <label class="form-label">발주번호</label>
            <input type="text" class="form-control" name="placeNum" id="placeNum" required />
              -->
          </div>
          <div class="mb-2">
            <label class="form-label">사업장 유형</label>
            <select class="form-select" name="orderType" id="orderType" required>
              <option value="">-- 선택 --</option>
              <option value="CUSTOMER">고객사</option>
              <option value="SUPPLIER">거래처</option>
            </select>
            <select class="form-select" name="companyId" id="companyId" required>
			  <option value="1">삼성전자</option>
			  <option value="2">현대자동차</option>
			</select>
            
          </div>
          
          <div class="row mb-3">
           <div class="col-md-4">
            <label class="form-label">담당자</label>
            <input type="text" class="form-control" name="employeeName" id="employeeName" required />
          </div>
         <div class="col-md-4">
            <label class="form-label">담당자 이메일</label>
            <input type="text" class="form-control" name="employeeEmail" id="employeeEmail" required />
          </div>            
          <div class="col-md-4">
            <label class="form-label">담당자 번호</label>
            <input type="text" class="form-control" name="employeeTel" id="employeeTel" required />
          </div>          
        </div>
        
	 <!-- 품목 입력 영역 -->
	<div class="mb-3">
	  <label class="form-label">품목 리스트</label>
	  <div id="itemListContainer">
	    <div class="row align-items-end g-2 mb-2 item-row">
	      
	      <div class="col-md-3">
	        <select class="form-select" name="itemId" required>
	          <option value="">-- 품목 선택 --</option>
	          <option value="P001">완제품 A</option>
	          <option value="P002">완제품 B</option>
	        </select>
	      </div>
	      <div class="col-md-3">
	        <input type="text" class="form-control" name="itemCode" placeholder="품목코드" required />
	      </div>
	      <div class="col-md-2">
	        <input type="number" class="form-control" name="quantity" placeholder="수량" min="1" required />
	      </div>
	      <div class="col-md-2">
	        <input type="text" class="form-control" name="unit" value="EA" required />
	      </div>
	      <div class="col-md-2">
	        <button type="button" class="btn btn-danger btn-sm" onclick="removeItemRow(this)">삭제</button>
	      </div>
	    </div>
	  </div>
	  <button type="button" class="btn btn-outline-primary btn-sm" onclick="addItemRow()">+ 품목 추가</button>
	</div>

          
          <div class="mb-2">
            <label class="form-label">비고</label>
            <textarea class="form-control" name="note" id="note" rows="2"></textarea>
          </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="placereset()">초기화</button>
          <button type="button" class="btn btn-primary" onclick="placesubmit()">등록</button>
        </div>
      </form>
    </div>
  </div>
</div>
