<!-- /templates/bom/bom-view-modal.html -->
<div th:fragment="bomViewModal">
  <div class="modal fade" id="bomViewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">BOM 구성 상세 보기</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="container-fluid">
            <div class="row gx-4">
              <!-- 좌측: 품목 + 자재 리스트 -->
              <div class="col-md-3">
                <!-- 품목 리스트 -->
                <div class="card mb-3">
                  <div class="card-header text-center fw-bold">품목 리스트</div>
                  <div class="card-body p-2">
                    <table class="table table-sm table-bordered text-center mb-0">
                      <thead class="table-light">
                        <tr><th>No</th><th>코드</th><th>명</th><th>규격</th><th>단위</th></tr>
                      </thead>
                      <tbody>
                        <tr th:each="item, stat : ${productList}">
                          <td th:text="${stat.index + 1}"></td>
                          <td th:text="${item.code}"></td>
                          <td th:text="${item.name}"></td>
                          <td th:text="${item.spec}"></td>
                          <td th:text="${item.unit}"></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                <!-- 자재 리스트 -->
                <div class="card mb-4">
                  <div class="card-header text-center fw-bold">자재 리스트</div>
                  <div class="card-body p-2">
                    <table class="table table-sm table-bordered text-center mb-0">
                      <thead class="table-light">
                        <tr><th>No</th><th>코드</th><th>명</th><th>규격</th><th>단위</th></tr>
                      </thead>
                      <tbody>
                        <tr th:each="item, stat : ${materialList}">
                          <td th:text="${stat.index + 1}"></td>
                          <td th:text="${item.code}"></td>
                          <td th:text="${item.name}"></td>
                          <td th:text="${item.spec}"></td>
                          <td th:text="${item.unit}"></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

              <!-- 우측: 트리 구조 -->
              <div class="col-md-9">
                <div class="card mb-4">
                  <div class="card-header fw-bold">BOM 트리 구조</div>
                  <div class="card-body">
                    <ul class="list-unstyled">
                      <li>
                        └ <strong th:text="${bom.parentName}">제품A</strong>
                        <ul class="list-unstyled ms-3">
                          <li th:each="c : ${bom.components}">
                            └ <span th:text="${c.childName}">자재1</span>
                            <span class="text-muted small">
                              수량: <span th:text="${c.qty}">10</span>,
                              로스율: <span th:text="${c.lossRate}">5%</span>,
                              단가: <span th:text="${c.unitPrice}">300</span>,
                              비고: <span th:text="${c.remark}">-</span>
                            </span>
                          </li>
                        </ul>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>

            <!-- 하단: 구성 상세 테이블 -->
            <div class="row">
              <div class="col-12">
                <div class="card">
                  <div class="card-header fw-bold">BOM 구성 상세</div>
                  <div class="card-body p-2">
                    <table class="table table-sm table-bordered text-center mb-0">
                      <thead class="table-light">
                        <tr>
                          <th>No</th>
                          <th>품목명</th>
                          <th>원자재명</th>
                          <th>순번</th>
                          <th>소요량</th>
                          <th>로스율</th>
                          <th>재료비</th>
                          <th>비고</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr th:each="c, stat : ${bom.components}">
                          <td th:text="${stat.index + 1}"></td>
                          <td th:text="${bom.parentName}"></td>
                          <td th:text="${c.childName}"></td>
                          <td th:text="${c.seqNo}">1</td>
                          <td th:text="${c.qty}"></td>
                          <td th:text="${c.lossRate}"></td>
                          <td th:text="${c.unitPrice}"></td>
                          <td th:text="${c.remark}">-</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div> <!-- /.container-fluid -->
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>
