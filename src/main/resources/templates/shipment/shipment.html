<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>출고 관리</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    main {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }
  </style>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">

  <!-- 상단 헤더 (Thymeleaf fragment) -->
  <div th:replace="~{/layouts/header :: header}"></div>

  <div class="d-flex flex-grow-1">
    <!-- 좌측 사이드바 (Thymeleaf fragment) -->
    <div th:replace="~{/layouts/sidebar :: sidebar}"></div>

    <!-- 메인 영역 -->
    <main>
      <h2 class="mb-4">출고 관리</h2>

      <!-- ===== 검색바 ===== -->
      <div class="row g-2 mb-3">
        <div class="col-md-2">
          <input type="text" class="form-control" placeholder="품목명" id="searchItemName">
        </div>
        <div class="col-md-2">
          <input type="date" class="form-control" id="fromDate">
        </div>
        <div class="col-md-2">
          <input type="date" class="form-control" id="toDate">
        </div>
        <div class="col-md-2">
          <select class="form-select" id="warehouseFilter">
            <option value="">전체 창고</option>
            <!-- JS로 셀렉트 옵션 채우기 -->
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-secondary w-100" id="btnSearch">검색</button>
        </div>
      </div>

      <!-- ===== 버튼들 ===== -->
      <div class="mb-3 d-flex gap-2">
        <button class="btn btn-success">엑셀 다운로드</button>
        <button class="btn btn-danger">삭제</button>
        <button class="btn btn-primary">+ 출고 등록</button>
      </div>

      <!-- ===== 출고 테이블 ===== -->
      <div class="table-responsive">
        <table class="table table-bordered align-middle text-center" id="shipmentTable">
          <thead class="table-light">
            <tr>
              <th><input type="checkbox" id="selectAll"/></th>
              <th>순번</th>
              <th>출고일자</th>
              <th>고객사명</th>
              <th>품목코드</th>
              <th>품목명</th>
              <th>수량</th>
              <th>단위</th>
              <th>창고</th>
              <th>담당자</th>
              <th>비고</th>
              <th>상세</th>
              <th>수정</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS( fetch("/api/shipments") )로 데이터를 렌더링해 줄 부분 -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- 전용 JS 로드 -->
  <script src="/js/shipment/shipment.js"></script>
</body>
</html>
