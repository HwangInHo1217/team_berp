<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>출고 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">

  <!-- ✅ 공통 레이아웃 삽입 영역 -->
  <div id="header"></div>
  <div class="d-flex flex-grow-1">
    <div id="sidebar"></div>

    <!-- ✅ 본문 영역 -->
    <div class="container py-4">
      <h2 class="mb-4">출고 관리</h2>

      <!-- 🔍 검색 + 버튼 -->
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <input type="text" class="form-control w-auto" placeholder="품목명" />
        <input type="date" class="form-control w-auto" />
        <span class="align-self-center">~</span>
        <input type="date" class="form-control w-auto" />
        <select class="form-select w-auto">
          <option>전체 창고</option>
          <option>자재창고 A</option>
          <option>완제품창고</option>
        </select>
        <button class="btn btn-outline-secondary">검색</button>

        <button class="btn btn-outline-success ms-auto">엑셀 다운로드</button>
        <button class="btn btn-danger">삭제</button>
        <button class="btn btn-primary" onclick="openShipmentAddModal()" data-bs-toggle="modal" data-bs-target="#shipmentRegisterModal">
          + 출고 등록
        </button>
      </div>

      <!-- 📋 출고 테이블 -->
      <div class="table-responsive">
        <table class="table table-bordered text-center align-middle">
          <thead class="table-light">
            <tr>
              <th><input type="checkbox" /></th>
              <th>순번</th>
              <th>출고일자</th>
              <th>고객사명</th>
              <th>품목수</th>
              <th>금액</th>
              <th>담당자</th>
              <th>상세</th>
              <th>수정</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input type="checkbox" /></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td>
                <button class="btn btn-info btn-sm"
                  onclick="openShipmentDetailModal({
                    date: '2025-05-18',
                    customer: '삼성전자',
                    itemCode: 'P001',
                    itemName: '완제품 A',
                    quantity: 200,
                    unit: 'EA',
                    warehouse: '완제품창고',
                    manager: '김인호',
                    note: '-'
                  })">상세</button>
              </td>
              <td>
                <button class="btn btn-warning btn-sm"
                  onclick="openShipmentEditModal({
                    id: 1,
                    date: '2025-05-18',
                    customer_id: '1',
                    item_id: 'P001',
                    quantity: 200,
                    unit: 'EA',
                    warehouse_id: '1',
                    manager: '김인호',
                    note: '-'
                  })">수정</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
