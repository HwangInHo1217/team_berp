<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>출고 관리</title>
  <!-- Bootstrap CSS -->
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body>
  <!-- 공통 헤더/사이드바 포함 -->
  <div th:replace="~{layouts/header :: header}"></div>
  <aside th:replace="~{layouts/sidebar :: sidebar}"></aside>

  <main class="container-fluid mt-4">
    <h2>출고 관리</h2>

    <!-- 출고 대기 주문 → 가출고/출고 버튼 -->
    <div class="mb-3">
      <button id="btn-preShip" class="btn btn-warning" disabled
              data-bs-toggle="modal" data-bs-target="#registerModal">
        가출고
      </button>
      <button id="btn-doShip" class="btn btn-primary" disabled
              data-bs-toggle="modal" data-bs-target="#registerModal">
        출고
      </button>
    </div>

    <!-- 대기 주문 리스트 -->
    <table class="table table-bordered align-middle text-center">
      <thead class="table-light">
        <tr>
          <th><input type="checkbox" id="chk-all-pending"/></th>
          <th>주문일자</th><th>고객사</th><th>품목수</th>
          <th>총금액</th><th>담당자</th><th>거래처담당자</th>
          <th>상세</th>
        </tr>
      </thead>
      <tbody>
      <tr th:each="o: ${pendingOrders}">
        <td>
          <input type="checkbox" class="chk-pending"
                 th:value="${o.orderId}"/>
        </td>
        <td th:text="${o.orderDate}"></td>
        <td th:text="${o.companyName}"></td>
        <td th:text="${o.orderQty}"></td>
        <td th:text="${o.amount}"></td>
        <td th:text="${o.empName}"></td>
        <td th:text="${o.companyEmpName}"></td>
        <td>
          <button class="btn btn-sm btn-info btn-order-detail"
                  th:data-id="${o.orderId}"
                  data-bs-toggle="modal" data-bs-target="#registerDetailModal">
            상세
          </button>
        </td>
      </tr>
      </tbody>
    </table>

    <!-- 전체 출고 내역 리스트 -->
    <h3 class="mt-5">전체 출고 내역</h3>
    <table class="table table-bordered align-middle text-center">
      <thead class="table-light">
        <tr>
          <th>출고여부</th><th>출고일시</th><th>고객사</th><th>품목수</th>
          <th>총금액</th><th>담당자</th><th>거래처담당자</th>
          <th>상세</th><th>수정</th>
        </tr>
      </thead>
      <tbody>
      <tr th:each="s: ${shipments}">
        <td th:text="${s.useYn}"></td>
        <td th:text="${s.shippedAt}"></td>
        <td th:text="${s.companyName}"></td>
        <td th:text="${s.orderQty}"></td>
        <td th:text="${s.amount}"></td>
        <td th:text="${s.empName}"></td>
        <td th:text="${s.companyEmpName}"></td>
        <td>
          <button class="btn btn-sm btn-info btn-ship-detail"
                  th:data-id="${s.shipmentId}"
                  data-bs-toggle="modal" data-bs-target="#detailModal">
            상세
          </button>
        </td>
        <td>
          <button class="btn btn-sm btn-secondary btn-ship-update"
                  th:data-id="${s.shipmentId}"
                  data-bs-toggle="modal" data-bs-target="#registerModal">
            수정
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </main>

  <!-- 모달: 출고등록(가/출고) -->
  <div th:replace="shipment/shipment-register-modal :: register-fragment"></div>
  <!-- 모달: 주문 상세(출고등록용) -->
  <div th:replace="shipment/shipment-register-detail-modal :: detail-fragment"></div>
  <!-- 모달: 출고 상세 -->
  <div th:replace="shipment/shipment-detail-modal :: detail-fragment"></div>

  <!-- Bootstrap JS -->
  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <!-- 분리된 출고 관리 전용 스크립트 -->
  <script th:src="@{/js/shipment.js}"></script>
</body>
</html>
