<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>생산계획 관리</title>
<!-- jQuery CDN (select2보다 위에 위치해야 함) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- select2 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
	rel="stylesheet" />
<!-- select2 JS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet" />

<script
	src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>


</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
	<div th:replace="~{/layouts/header :: header}"></div>
	<div class="d-flex flex-grow-1">
		<div th:replace="~{/layouts/sidebar :: sidebar}"></div>
		<main class="p-4 flex-fill">
			<div class="container">
				<h2 class="mb-4">생산계획 관리</h2>

				<!-- 🔍 검색 및 버튼 영역 -->
				<div class="d-flex flex-wrap gap-2 align-items-center mb-3">
					<input type="date" id="startDateInput" name="startDate"
						class="form-control w-auto" placeholder="계획일자" /> <span>~</span>
					<input type="date" id="endDateInput" name="endDate"
						class="form-control w-auto" placeholder="계획일자" /> <input
						type="text" id="keywordInput" name="keyword"
						class="form-control w-auto" placeholder="품목명/코드" /> <select
						id="statusFilter" class="form-select w-auto">
						<option value="">전체</option>
						<option value="PLANNED">계획</option>
						<option value="ORDERED">지시됨</option>
						<option value="COMPLETED">완료</option>
					</select>

					<button class="btn btn-outline-secondary"
						onclick="fetchProdPlanList(0)">검색</button>
					<button class="btn btn-outline-success ms-auto">엑셀 다운로드</button>
					<button class="btn btn-primary" onclick="openPlanAddModal()">
						+ 생산계획 등록</button>

				</div>

				<!-- 📋 생산계획 테이블 -->
				<div class="table-responsive">
					<table class="table table-bordered text-center align-middle">
						<thead class="table-light">
							<tr>
								<th><input type="checkbox" /></th>
								<th>계획번호</th>
								<th>계획일자</th>
								<th>품목코드</th>
								<th>품목명</th>
								<th>계획수량</th>
								<th>단위</th>
								<th>납기일</th>
								<th>생산상태</th>
								<th>담당자</th>
								<th>비고</th>
								<th>상세</th>
								<th>수정</th>
								<th>삭제</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td><input type="checkbox" /></td>
								<td>PP202405001</td>
								<td>2025-05-23</td>
								<td>P001</td>
								<td>완제품 A</td>
								<td>1000</td>
								<td>EA</td>
								<td>2025-06-01</td>
								<td>계획</td>
								<td>김인호</td>
								<td>-</td>
								<td><button class="btn btn-info btn-sm">상세</button></td>
								<td>
									<button class="btn btn-warning btn-sm">수정</button>
								</td>
								<td><button class="btn btn-danger btn-sm"
										onclick="alert('삭제 기능은 추후 구현 예정')">삭제</button></td>
							</tr>
						</tbody>
					</table>
				</div>
				<nav aria-label="페이지 네비게이션">
					<ul class="pagination justify-content-center" id="pagination">
						<!-- JS에서 채워주는 부분이라서 지움 -->
					</ul>
				</nav>
			</div>
		</main>
	</div>

	<div th:replace="~{/layouts/footer :: footer}"></div>

	<!-- 모달 영역 -->
	<div id="planRegisterModalWrapper">
		<!-- 생산계획 등록/수정 모달 -->
		<div class="modal fade" id="planRegisterModal" tabindex="-1"
			aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<form id="planForm" method="POST">
						<div class="modal-header">
							<h5 class="modal-title">생산계획 등록</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="닫기"></button>
						</div>
						<div class="modal-body">
							<div class="mb-2">
								<label class="form-label">계획일자</label> <input type="date"
									class="form-control" name="plan_date" id="planDate" required />
							</div>

							<div class="mb-2">
								<label class="form-label">품목 선택</label> <select
									class="form-select" name="item_id" id="itemSelect" required></select>
							</div>
							<div class="mb-2">
								<label class="form-label">품목코드</label> <input type="text"
									class="form-control" name="item_code" id="itemCode" readonly />
							</div>
							<div class="mb-2">
								<label class="form-label">품목명</label> <input type="text"
									class="form-control" name="item_name" id="itemName" readonly />
							</div>
							<div class="mb-2">
								<label class="form-label">계획수량</label> <input type="number"
									class="form-control" name="quantity" id="quantity" required
									min="1" />
							</div>
							<div class="mb-2">
								<label class="form-label">단위</label> <input type="text"
									class="form-control" name="unit" id="unit" readonly />
							</div>
							<div class="mb-2">
								<label class="form-label">납기일</label> <input type="date"
									class="form-control" name="due_date" id="dueDate" required />
							</div>
							<div class="mb-2">
								<label class="form-label">생산상태</label> <select
									class="form-select" name="status" id="status" required>
									<option value="PLANNED">계획</option>
									<option value="ORDERED">진행중</option>
									<option value="COMPLETED">완료</option>

								</select>
							</div>
							<div class="mb-2">
								<label class="form-label">담당자</label> <input type="text"
									class="form-control" name="manager" id="manager" required />
							</div>
							<div class="mb-2">
								<label class="form-label">비고</label>
								<textarea class="form-control" name="note" id="note" rows="2"></textarea>
							</div>
						</div>
						<div class="modal-footer">
							<button type="reset" class="btn btn-secondary">초기화</button>
							<button type="button" class="btn btn-primary" id="submitBtn">등록</button>
						</div>
					</form>
				</div>
			</div>
		</div>

	</div>
	<div id="planDetailModalWrapper">
		<!-- 생산계획 상세 모달 -->
		<div class="modal fade" id="planDetailModal" tabindex="-1"
			aria-hidden="true">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">생산계획 상세정보</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="닫기"></button>
					</div>
					<div class="modal-body">
						<table class="table table-bordered">
							<tbody>
								<tr>
									<th>계획번호</th>
									<td id="planDetailPlanNo"></td>
									<th>계획일자</th>
									<td id="planDetailPlanDate"></td>
								</tr>
								<tr>
									<th>품목코드</th>
									<td id="planDetailItemCode"></td>
									<th>품목명</th>
									<td id="planDetailItemName"></td>
								</tr>
								<tr>
									<th>계획수량</th>
									<td id="planDetailQuantity"></td>
									<th>단위</th>
									<td id="planDetailUnit"></td>
								</tr>
								<tr>
									<th>납기일</th>
									<td id="planDetailDueDate"></td>
									<th>생산상태</th>
									<td id="planDetailStatus"></td>
								</tr>
								<tr>
									<th>담당자</th>
									<td id="planDetailManager"></td>
									<th>비고</th>
									<td id="planDetailNote"></td>
								</tr>
							</tbody>
						</table>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">닫기</button>
					</div>
				</div>
			</div>
		</div>

	</div>

	<script src="./js/plan/plan.js"></script>
</body>
</html>
