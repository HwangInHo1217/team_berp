<!-- ===== stock_view.html (재고 전용 기능으로 개선) ===== -->
<div class="container" th:fragment="stock_view">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-warehouse me-2"></i>재고 관리</h2>
        <div class="d-flex gap-2">
            <span class="badge bg-info">총 재고: <span id="totalStockCount">-</span>개 품목</span>
            <span class="badge bg-warning">안전재고 미달: <span id="belowSafetyCount">-</span>개</span>
            <span class="badge bg-danger">재고없음: <span id="outOfStockCount">-</span>개</span>
        </div>
    </div>

    <!-- 검색 및 필터 영역 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small text-muted">품목 검색</label>
                    <input type="text" class="form-control" id="searchInput" 
                           placeholder="품목명 또는 품목코드 입력" />
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">창고</label>
                    <select class="form-select" id="warehouseSelect">
                        <option value="">전체 창고</option>
                        <!-- 동적 로딩됨 -->
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">품목유형</label>
                    <select class="form-select" id="itemTypeFilter">
                        <option value="">전체 품목</option>
                        <option value="raw">자재</option>
                        <option value="product">완제품</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">재고상태</label>
                    <select class="form-select" id="stockStatusFilter">
                        <option value="">전체 재고</option>
                        <option value="inStock">재고 있음</option>
                        <option value="outOfStock">재고 없음</option>
                        <option value="belowSafety">안전재고 미달</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end gap-2">
                    <button class="btn btn-primary" id="searchBtn">
                        <i class="fas fa-search"></i> 검색
                    </button>
                    <button class="btn btn-outline-secondary" id="resetBtn">
                        <i class="fas fa-redo"></i> 초기화
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 재고 관리 액션 버튼 영역 -->
    <div class="row mb-3">
        <div class="col-md-6">
            <div class="btn-group" role="group">
                <!-- 재고 전용 관리 기능들 -->
                <button class="btn btn-warning" id="stockAdjustBtn" title="실사 후 재고 수량 조정">
                    <i class="fas fa-edit"></i> 재고조정
                </button>
                <button class="btn btn-info" id="stockTransferBtn" title="창고간 재고 이동">
                    <i class="fas fa-exchange-alt"></i> 창고이동
                </button>
                <button class="btn btn-secondary" id="stockStatusBtn" title="재고 상태 변경">
                    <i class="fas fa-tag"></i> 상태변경
                </button>
            </div>
            
            <!-- 긴급 처리 버튼 (소량만) -->
            <div class="btn-group ms-3" role="group">
                <button class="btn btn-outline-danger btn-sm" id="quickOutBtn" title="긴급 소량 출고">
                    <i class="fas fa-bolt"></i> 긴급출고
                </button>
            </div>
        </div>
        
        <div class="col-md-6 text-end">
            <!-- 다른 페이지로 이동 버튼들 -->
            <div class="btn-group me-2" role="group">
                <a href="/receiving" class="btn btn-outline-success" title="정식 입고 처리">
                    <i class="fas fa-truck"></i> 입고페이지로
                </a>
                <a href="/shipping" class="btn btn-outline-primary" title="정식 출고 처리">
                    <i class="fas fa-shipping-fast"></i> 출고페이지로
                </a>
            </div>
            
            <!-- 보고서 및 유틸리티 -->
            <div class="btn-group" role="group">
                <button class="btn btn-outline-success" id="excelDownloadBtn">
                    <i class="fas fa-file-excel"></i> 엑셀다운로드
                </button>
                <button class="btn btn-outline-info" id="stockReportBtn" title="재고 현황 리포트">
                    <i class="fas fa-chart-bar"></i> 현황리포트
                </button>
            </div>
        </div>
    </div>

    <!-- 재고 현황 테이블 -->
    <div class="table-responsive">
        <table class="table table-hover" id="stockTable">
            <thead class="table-light">
                <tr>
                    <th width="5%">
                        <input type="checkbox" id="selectAll" />
                    </th>
                    <th width="5%">순번</th>
                    <th width="10%" class="sortable" data-sort="itemCode">
                        품목코드 <i class="fas fa-sort"></i>
                    </th>
                    <th width="15%" class="sortable" data-sort="itemName">
                        품목명 <i class="fas fa-sort"></i>
                    </th>
                    <th width="8%">품목유형</th>
                    <th width="10%" class="sortable" data-sort="warehouseName">
                        창고 <i class="fas fa-sort"></i>
                    </th>
                    <th width="8%" class="sortable" data-sort="quantity">
                        재고수량 <i class="fas fa-sort"></i>
                    </th>
                    <th width="5%">단위</th>
                    <th width="8%">LOT번호</th>
                    <th width="8%">최종입고일</th>
                    <th width="8%">최종출고일</th>
                    <th width="5%">상태</th>
                    <th width="5%">액션</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <!-- JavaScript로 동적 렌더링 -->
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav aria-label="Page navigation" id="paginationNav">
        <ul class="pagination justify-content-center" id="paginationUl">
            <!-- 동적 생성 -->
        </ul>
    </nav>
    
    <!-- 페이지네이션 정보 -->
    <div id="paginationInfoDiv" class="text-center mt-2">
        <span id="paginationInfoText"></span>
    </div>
</div>

<!-- ===== 재고 조정 모달 ===== -->
<div class="modal fade" id="stockAdjustModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-edit me-2"></i>재고 조정
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="stockAdjustForm">
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>주의:</strong> 재고 조정은 실제 재고와 시스템 재고의 차이를 보정하는 기능입니다.
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">선택된 재고</label>
                        <div id="selectedStockInfo" class="form-control-plaintext bg-light p-2 rounded">
                            재고를 선택해주세요
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">현재 시스템 재고</label>
                            <input type="number" class="form-control" id="currentQty" readonly />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-danger">실제 재고 수량 *</label>
                            <input type="number" class="form-control" id="actualQty" 
                                   min="0" required placeholder="실사 후 실제 수량" />
                        </div>
                    </div>
                    
                    <div class="mb-3 mt-3">
                        <label class="form-label">조정 사유 *</label>
                        <select class="form-select" id="adjustReason" required>
                            <option value="">조정 사유를 선택하세요</option>
                            <option value="INVENTORY_COUNT">재고 실사</option>
                            <option value="DAMAGE">상품 파손</option>
                            <option value="LOSS">분실</option>
                            <option value="EXPIRED">유통기한 만료</option>
                            <option value="SYSTEM_ERROR">시스템 오류 보정</option>
                            <option value="OTHER">기타</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">상세 설명</label>
                        <textarea class="form-control" id="adjustComment" rows="3" 
                                  placeholder="조정 사유에 대한 상세 설명을 입력하세요"></textarea>
                    </div>
                    
                    <div id="adjustPreview" class="alert alert-info d-none">
                        <strong>조정 미리보기:</strong>
                        <div id="adjustPreviewText"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-warning" id="confirmAdjust">
                    <i class="fas fa-edit"></i> 재고 조정 실행
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 창고 이동 모달 ===== -->
<div class="modal fade" id="stockTransferModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-exchange-alt me-2"></i>창고간 재고 이동
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="stockTransferForm">
                    <div class="mb-3">
                        <label class="form-label">이동할 재고</label>
                        <div id="transferStockInfo" class="form-control-plaintext bg-light p-2 rounded">
                            재고를 선택해주세요
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">출발 창고</label>
                            <input type="text" class="form-control" id="fromWarehouse" readonly />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">도착 창고 *</label>
                            <select class="form-select" id="toWarehouse" required>
                                <option value="">도착 창고를 선택하세요</option>
                                <!-- 동적 로딩 -->
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">현재 수량</label>
                            <input type="number" class="form-control" id="availableQty" readonly />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">이동 수량 *</label>
                            <input type="number" class="form-control" id="transferQty" 
                                   min="1" required placeholder="이동할 수량" />
                        </div>
                    </div>
                    
                    <div class="mb-3 mt-3">
                        <label class="form-label">이동 사유</label>
                        <select class="form-select" id="transferReason">
                            <option value="">이동 사유를 선택하세요</option>
                            <option value="PRODUCTION">생산 투입</option>
                            <option value="SHIPPING_PREPARE">출하 준비</option>
                            <option value="REORGANIZATION">창고 정리</option>
                            <option value="MAINTENANCE">창고 보수</option>
                            <option value="OTHER">기타</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">비고</label>
                        <textarea class="form-control" id="transferComment" rows="2" 
                                  placeholder="이동에 대한 추가 설명"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-info" id="confirmTransfer">
                    <i class="fas fa-exchange-alt"></i> 재고 이동 실행
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 긴급 출고 모달 ===== -->
<div class="modal fade" id="quickOutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger">
                    <i class="fas fa-bolt me-2"></i>긴급 출고
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>긴급 출고:</strong> 소량의 급한 출고만 처리하세요.<br>
                    대량 출고는 <strong>출고 페이지</strong>를 이용해주세요.
                </div>
                
                <form id="quickOutForm">
                    <div class="mb-3">
                        <label class="form-label">선택된 재고</label>
                        <div id="quickOutStockInfo" class="form-control-plaintext bg-light p-2 rounded">
                            -
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">현재고</label>
                            <input type="number" class="form-control" id="quickCurrentQty" readonly />
                        </div>
                        <div class="col-6">
                            <label class="form-label">출고수량 *</label>
                            <input type="number" class="form-control" id="quickOutQty" 
                                   min="1" max="10" required placeholder="최대 10개" />
                        </div>
                    </div>
                    
                    <div class="mb-3 mt-3">
                        <label class="form-label">출고 사유</label>
                        <input type="text" class="form-control" id="quickOutReason" 
                               placeholder="긴급 출고 사유" />
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-danger" id="confirmQuickOut">
                    <i class="fas fa-bolt"></i> 긴급 출고
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 기존 재고 상세 모달도 유지 -->
<div th:replace="~{stock/stock_detail_modal :: stock_modal}"></div>

<!-- 재고 이력 모달 -->
<div class="modal fade" id="stockHistoryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">재고 입출고 이력</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="historyInfo" class="mb-3">
                    <!-- 품목/창고 정보 표시 -->
                </div>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>일시</th>
                                <th>구분</th>
                                <th>수량</th>
                                <th>비고</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- 동적 로딩 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
